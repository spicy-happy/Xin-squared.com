<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Chinese! 学中文</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #ffecd2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    h1 {
      font-size: 2.2rem;
      color: #e44d6e;
      text-shadow: 2px 2px 0 #fff;
      margin-bottom: 10px;
      text-align: center;
    }

    .subtitle {
      font-size: 1rem;
      color: #666;
      margin-bottom: 20px;
    }

    /* Score & streak */
    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .stat-box {
      background: #fff;
      border-radius: 16px;
      padding: 10px 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .stat-box .label { color: #999; font-size: 0.8rem; font-weight: 400; }
    .stat-box .value { color: #e44d6e; }
    .streak-fire { font-size: 1.3rem; }

    /* Card */
    .card-container {
      perspective: 800px;
      width: 320px;
      height: 380px;
      margin-bottom: 24px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      padding: 30px;
    }

    .card-front {
      background: #fff;
    }

    .card-back {
      background: linear-gradient(135deg, #a18cd1, #fbc2eb);
      transform: rotateY(180deg);
      color: #fff;
    }

    .card-chinese {
      font-size: 5rem;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .card-pinyin {
      font-size: 1.5rem;
      color: #e44d6e;
      margin-bottom: 6px;
    }



    .listen-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.6rem;
      opacity: 0.5;
      transition: opacity 0.2s, transform 0.2s;
      padding: 4px;
      line-height: 1;
    }

    .listen-btn:hover { opacity: 1; transform: scale(1.15); }
    .card-back .listen-btn { color: #fff; }

    .card-back .card-chinese { color: #fff; font-size: 3rem; margin-bottom: 4px; }
    .card-back .card-english {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .card-back .card-pinyin { color: rgba(255,255,255,0.85); margin-bottom: 16px; }

    .card-back .card-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .card-back .card-actions .btn {
      padding: 10px 22px;
      font-size: 0.95rem;
    }

    /* Buttons */
    .btn {
      border: none;
      border-radius: 50px;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
    .btn:active { transform: translateY(0); }

    .btn-know { background: #4ecdc4; color: #fff; }
    .btn-dont-know { background: #ff6b6b; color: #fff; }
    .btn-next { background: #e44d6e; color: #fff; }

    /* Level progress bar */
    .level-bar-wrap {
      width: 320px;
      height: 10px;
      background: rgba(255,255,255,0.5);
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .level-bar {
      height: 100%;
      background: linear-gradient(90deg, #4ecdc4, #44b09e);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .review-tag {
      position: absolute;
      top: 16px;
      left: 16px;
      background: #ff6b6b;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-back .review-tag {
      background: rgba(255,255,255,0.3);
    }

    /* Reward overlay */
    .reward-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .reward-overlay.show { display: flex; }

    .reward-box {
      background: #fff;
      border-radius: 30px;
      padding: 40px;
      text-align: center;
      max-width: 360px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .reward-picture {
      font-size: 8rem;
      line-height: 1;
      margin-bottom: 10px;
    }

    .reward-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #e44d6e;
      margin-bottom: 6px;
    }

    .reward-msg {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 20px;
    }

    /* Confetti */
    .confetti {
      position: fixed;
      top: -10px;
      z-index: 101;
      font-size: 1.8rem;
      animation: fall linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* Responsive */
    @media (max-width: 400px) {
      .card-container { width: 280px; height: 340px; }
      .card-chinese { font-size: 4rem; }
      .level-bar-wrap { width: 280px; }
      h1 { font-size: 1.7rem; }
    }
  </style>
</head>
<body>

  <h1>Learn Chinese! 学中文</h1>
  <p class="subtitle">Endless Mode - Tap to flip!</p>

  <div class="stats">
    <div class="stat-box"><span class="label">Level</span><br><span class="value" id="level">1</span></div>
    <div class="stat-box"><span class="label">Score</span><br><span class="value" id="score">0</span></div>
    <div class="stat-box"><span class="label">Streak</span><br><span class="streak-fire" id="streak">0 🔥</span></div>
  </div>

  <div class="level-bar-wrap">
    <div class="level-bar" id="levelBar" style="width: 0%"></div>
  </div>

  <div class="card-container" id="cardContainer">
    <div class="card" id="card">
      <div class="card-face card-front">
        <div class="review-tag" id="reviewTagFront" style="display:none">Review</div>
        <button class="listen-btn" onclick="event.stopPropagation(); speakWord()">&#x1f50a;</button>
        <div class="card-chinese" id="cardChinese"></div>
      </div>
      <div class="card-face card-back">
        <div class="review-tag" id="reviewTagBack" style="display:none">Review</div>
        <button class="listen-btn" onclick="event.stopPropagation(); speakWord()">&#x1f50a;</button>
        <div class="card-english" id="cardEnglish"></div>
        <div class="card-chinese" id="cardChineseBack"></div>
        <div class="card-pinyin" id="cardPinyinBack"></div>
        <div class="card-actions">
          <button class="btn btn-know" onclick="event.stopPropagation(); answer(true)">I knew it!</button>
          <button class="btn btn-dont-know" onclick="event.stopPropagation(); answer(false)">Still learning</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Reward overlay -->
  <div class="reward-overlay" id="rewardOverlay">
    <div class="reward-box">
      <div class="reward-picture" id="rewardPic"></div>
      <div class="reward-title" id="rewardTitle"></div>
      <div class="reward-msg" id="rewardMsg"></div>
      <button class="btn btn-next" onclick="closeReward()">Keep going! →</button>
    </div>
  </div>


<script>
  // --- Word bank organized by difficulty level (1-5) ---
  const wordBank = {
    1: [
      { chinese: "一", pinyin: "yī", english: "One" },
      { chinese: "二", pinyin: "èr", english: "Two" },
      { chinese: "三", pinyin: "sān", english: "Three" },
      { chinese: "四", pinyin: "sì", english: "Four" },
      { chinese: "五", pinyin: "wǔ", english: "Five" },
      { chinese: "大", pinyin: "dà", english: "Big" },
      { chinese: "小", pinyin: "xiǎo", english: "Small" },
      { chinese: "人", pinyin: "rén", english: "Person" },
      { chinese: "口", pinyin: "kǒu", english: "Mouth" },
      { chinese: "手", pinyin: "shǒu", english: "Hand" },
      { chinese: "山", pinyin: "shān", english: "Mountain" },
      { chinese: "水", pinyin: "shuǐ", english: "Water" },
      { chinese: "火", pinyin: "huǒ", english: "Fire" },
      { chinese: "天", pinyin: "tiān", english: "Sky" },
      { chinese: "日", pinyin: "rì", english: "Day" },
    ],
    2: [
      { chinese: "六", pinyin: "liù", english: "Six" },
      { chinese: "七", pinyin: "qī", english: "Seven" },
      { chinese: "八", pinyin: "bā", english: "Eight" },
      { chinese: "九", pinyin: "jiǔ", english: "Nine" },
      { chinese: "十", pinyin: "shí", english: "Ten" },
      { chinese: "红", pinyin: "hóng", english: "Red" },
      { chinese: "蓝", pinyin: "lán", english: "Blue" },
      { chinese: "白", pinyin: "bái", english: "White" },
      { chinese: "黑", pinyin: "hēi", english: "Black" },
      { chinese: "猫", pinyin: "māo", english: "Cat" },
      { chinese: "狗", pinyin: "gǒu", english: "Dog" },
      { chinese: "鱼", pinyin: "yú", english: "Fish" },
      { chinese: "鸟", pinyin: "niǎo", english: "Bird" },
      { chinese: "花", pinyin: "huā", english: "Flower" },
      { chinese: "树", pinyin: "shù", english: "Tree" },
    ],
    3: [
      { chinese: "你好", pinyin: "nǐ hǎo", english: "Hello" },
      { chinese: "谢谢", pinyin: "xiè xie", english: "Thank you" },
      { chinese: "妈妈", pinyin: "mā ma", english: "Mom" },
      { chinese: "爸爸", pinyin: "bà ba", english: "Dad" },
      { chinese: "朋友", pinyin: "péng yǒu", english: "Friend" },
      { chinese: "太阳", pinyin: "tài yáng", english: "Sun" },
      { chinese: "月亮", pinyin: "yuè liang", english: "Moon" },
      { chinese: "星星", pinyin: "xīng xing", english: "Star" },
      { chinese: "苹果", pinyin: "píng guǒ", english: "Apple" },
      { chinese: "吃", pinyin: "chī", english: "Eat" },
      { chinese: "喝", pinyin: "hē", english: "Drink" },
      { chinese: "跑", pinyin: "pǎo", english: "Run" },
      { chinese: "走", pinyin: "zǒu", english: "Walk" },
      { chinese: "看", pinyin: "kàn", english: "Look" },
      { chinese: "听", pinyin: "tīng", english: "Listen" },
    ],
    4: [
      { chinese: "学校", pinyin: "xué xiào", english: "School" },
      { chinese: "老师", pinyin: "lǎo shī", english: "Teacher" },
      { chinese: "学生", pinyin: "xué shēng", english: "Student" },
      { chinese: "书", pinyin: "shū", english: "Book" },
      { chinese: "电话", pinyin: "diàn huà", english: "Phone" },
      { chinese: "医生", pinyin: "yī shēng", english: "Doctor" },
      { chinese: "高兴", pinyin: "gāo xìng", english: "Happy" },
      { chinese: "漂亮", pinyin: "piào liang", english: "Pretty" },
      { chinese: "快乐", pinyin: "kuài lè", english: "Joyful" },
      { chinese: "时间", pinyin: "shí jiān", english: "Time" },
      { chinese: "今天", pinyin: "jīn tiān", english: "Today" },
      { chinese: "明天", pinyin: "míng tiān", english: "Tomorrow" },
      { chinese: "昨天", pinyin: "zuó tiān", english: "Yesterday" },
      { chinese: "早上", pinyin: "zǎo shang", english: "Morning" },
      { chinese: "晚上", pinyin: "wǎn shang", english: "Evening" },
    ],
    5: [
      { chinese: "飞机", pinyin: "fēi jī", english: "Airplane" },
      { chinese: "图书馆", pinyin: "tú shū guǎn", english: "Library" },
      { chinese: "动物园", pinyin: "dòng wù yuán", english: "Zoo" },
      { chinese: "巧克力", pinyin: "qiǎo kè lì", english: "Chocolate" },
      { chinese: "西瓜", pinyin: "xī guā", english: "Watermelon" },
      { chinese: "聪明", pinyin: "cōng míng", english: "Smart" },
      { chinese: "勇敢", pinyin: "yǒng gǎn", english: "Brave" },
      { chinese: "认真", pinyin: "rèn zhēn", english: "Serious" },
      { chinese: "练习", pinyin: "liàn xí", english: "Practice" },
      { chinese: "冒险", pinyin: "mào xiǎn", english: "Adventure" },
      { chinese: "厨房", pinyin: "chú fáng", english: "Kitchen" },
      { chinese: "钢琴", pinyin: "gāng qín", english: "Piano" },
      { chinese: "恐龙", pinyin: "kǒng lóng", english: "Dinosaur" },
      { chinese: "蝴蝶", pinyin: "hú dié", english: "Butterfly" },
      { chinese: "彩虹", pinyin: "cǎi hóng", english: "Rainbow" },
    ],
  };

  // Silly reward pictures & messages
  const rewards = [
    { pic: "🦄", title: "Unicorn Power!", msg: "You unlocked a magical unicorn!" },
    { pic: "🐸", title: "Frog Prince!", msg: "Ribbit! You're doing great!" },
    { pic: "🦖", title: "Dino Genius!", msg: "RAWR means 'great job' in dinosaur!" },
    { pic: "🐙", title: "Octopus High-Five!", msg: "That's 8 high-fives at once!" },
    { pic: "🤪", title: "Silly Face!", msg: "You earned a silly face! Bleh!" },
    { pic: "🦩", title: "Flamingo Dance!", msg: "This flamingo is dancing for you!" },
    { pic: "🐵", title: "Monkey Business!", msg: "Ooh ooh ahh ahh! Smart monkey!" },
    { pic: "🦊", title: "Foxy Scholar!", msg: "Clever as a fox, you are!" },
    { pic: "🐋", title: "Whale of a Job!", msg: "Even the whales are impressed!" },
    { pic: "🦜", title: "Parrot Party!", msg: "Polly says you're awesome!" },
    { pic: "🐲", title: "Dragon Master!", msg: "The dragon bows to your wisdom!" },
    { pic: "🧜‍♂️", title: "Merman Mode!", msg: "Splashing through these words!" },
    { pic: "👽", title: "Alien Genius!", msg: "Even aliens are learning from you!" },
    { pic: "🤖", title: "Robo-Star!", msg: "Beep boop, you're amazing!" },
    { pic: "🧙‍♂️", title: "Word Wizard!", msg: "You cast a spell of smartness!" },
  ];

  const levelNames = ["", "Beginner", "Easy", "Medium", "Hard", "Expert"];
  const confettiChars = ["🎉", "⭐", "🌟", "💫", "🎊", "✨", "🎈", "❤️", "🧡", "💛"];

  // --- Game state ---
  let playerLevel = 1;       // Current difficulty 1-5
  let levelProgress = 0;     // Progress toward next level (0-4, need 5 correct to level up)
  let score = 0;
  let streak = 0;
  let cardsPlayed = 0;

  // Spaced repetition: words got wrong, scheduled for review
  // Each entry: { word, reviewAfter (cardNumber when to show it) }
  let reviewQueue = [];
  let currentWord = null;
  let isReviewCard = false;

  // Track which words have been seen per level so we don't repeat too soon
  let seenPerLevel = { 1: [], 2: [], 3: [], 4: [], 5: [] };

  function pickWord() {
    // Check if any review words are due
    const dueReviews = reviewQueue.filter(r => cardsPlayed >= r.reviewAfter);
    if (dueReviews.length > 0) {
      // Pick the oldest due review
      const review = dueReviews[0];
      reviewQueue = reviewQueue.filter(r => r !== review);
      isReviewCard = true;
      return review.word;
    }

    isReviewCard = false;

    // Adaptive: mostly pick from current level, sometimes from adjacent
    let level = playerLevel;
    const roll = Math.random();
    if (roll < 0.15 && playerLevel > 1) {
      level = playerLevel - 1; // 15% chance easier
    } else if (roll < 0.25 && playerLevel < 5) {
      level = playerLevel + 1; // 10% chance harder preview
    }

    const pool = wordBank[level];
    const seen = seenPerLevel[level];

    // Pick unseen words first, reset if all seen
    const unseen = pool.filter(w => !seen.includes(w.chinese));
    if (unseen.length === 0) {
      seenPerLevel[level] = [];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    const word = unseen[Math.floor(Math.random() * unseen.length)];
    seen.push(word.chinese);
    return word;
  }

  function showCard() {
    currentWord = pickWord();
    document.getElementById("cardChinese").textContent = currentWord.chinese;
    document.getElementById("cardChineseBack").textContent = currentWord.chinese;
    document.getElementById("cardPinyinBack").textContent = currentWord.pinyin;
    document.getElementById("cardEnglish").textContent = currentWord.english;
    document.getElementById("card").classList.remove("flipped");

    // Show/hide review tag
    const show = isReviewCard ? "" : "none";
    document.getElementById("reviewTagFront").style.display = show;
    document.getElementById("reviewTagBack").style.display = show;
  }

  function updateStats() {
    document.getElementById("score").textContent = score;
    document.getElementById("level").textContent = playerLevel;
    document.getElementById("streak").textContent = streak + " 🔥";
    const pct = (levelProgress / 5) * 100;
    document.getElementById("levelBar").style.width = pct + "%";
  }

  // Flip card on tap
  document.getElementById("cardContainer").addEventListener("click", () => {
    document.getElementById("card").classList.toggle("flipped");
  });

  function answer(knew) {
    cardsPlayed++;

    if (knew) {
      score++;
      streak++;

      // Level up progress
      levelProgress++;
      if (levelProgress >= 5 && playerLevel < 5) {
        playerLevel++;
        levelProgress = 0;
        showLevelUp();
      } else if (levelProgress >= 5) {
        levelProgress = 5; // Cap at max level
      }

      // Reward every 5 streak
      if (streak > 0 && streak % 5 === 0) {
        showReward();
      }
    } else {
      streak = 0;

      // Level down progress (but don't go below 0 or drop level too fast)
      levelProgress = Math.max(0, levelProgress - 1);

      // If at 0 progress and keep getting wrong, drop a level
      if (levelProgress === 0 && playerLevel > 1) {
        // Only drop if they got the last 2 wrong (be gentle)
        playerLevel--;
        levelProgress = 3; // Start partway through the lower level
      }

      // Schedule this word for review: come back after 3-6 cards
      const delay = 3 + Math.floor(Math.random() * 4);
      reviewQueue.push({
        word: { ...currentWord },
        reviewAfter: cardsPlayed + delay,
      });
    }

    updateStats();
    showCard();
  }

  function showLevelUp() {
    const r = {
      pic: ["🌟", "🚀", "⚡", "🏆", "👑"][playerLevel - 1] || "🌟",
      title: "Level " + playerLevel + "!",
      msg: "You reached " + levelNames[playerLevel] + " difficulty!"
    };
    document.getElementById("rewardPic").textContent = r.pic;
    document.getElementById("rewardTitle").textContent = r.title;
    document.getElementById("rewardMsg").textContent = r.msg;
    document.getElementById("rewardOverlay").classList.add("show");
    spawnConfetti();
  }

  function showReward() {
    const r = rewards[Math.floor(Math.random() * rewards.length)];
    document.getElementById("rewardPic").textContent = r.pic;
    document.getElementById("rewardTitle").textContent = r.title;
    document.getElementById("rewardMsg").textContent = r.msg;
    document.getElementById("rewardOverlay").classList.add("show");
    spawnConfetti();
  }

  function closeReward() {
    document.getElementById("rewardOverlay").classList.remove("show");
  }

  function spawnConfetti() {
    for (let i = 0; i < 30; i++) {
      const el = document.createElement("div");
      el.classList.add("confetti");
      el.textContent = confettiChars[Math.floor(Math.random() * confettiChars.length)];
      el.style.left = Math.random() * 100 + "vw";
      el.style.animationDuration = (2 + Math.random() * 3) + "s";
      el.style.animationDelay = Math.random() * 1 + "s";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 6000);
    }
  }

  function speakWord() {
    const utterance = new SpeechSynthesisUtterance(currentWord.chinese);
    utterance.lang = "zh-CN";
    utterance.rate = 0.8;
    speechSynthesis.speak(utterance);
  }

  // Start!
  updateStats();
  showCard();
</script>

<div style="position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); font-size: 0.75rem; color: rgba(0,0,0,0.3);">v2.0</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Learn Chinese! 学中文</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 50%, #ffecd2 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    h1 {
      font-size: 2.2rem;
      color: #e44d6e;
      text-shadow: 2px 2px 0 #fff;
      margin-bottom: 10px;
      text-align: center;
    }

    .subtitle {
      font-size: 1rem;
      color: #666;
      margin-bottom: 20px;
    }

    /* Score & streak */
    .stats {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .stat-box {
      background: #fff;
      border-radius: 16px;
      padding: 10px 22px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      font-weight: 700;
      font-size: 1.1rem;
    }

    .stat-box .label { color: #999; font-size: 0.8rem; font-weight: 400; }
    .stat-box .value { color: #e44d6e; }
    .streak-fire { font-size: 1.3rem; }

    /* Card */
    .card-container {
      perspective: 800px;
      width: 320px;
      height: 380px;
      margin-bottom: 24px;
      cursor: pointer;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card.flipped { transform: rotateY(180deg); }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 30px rgba(0,0,0,0.15);
      padding: 30px;
    }

    .card-front {
      background: #fff;
    }

    .card-back {
      background: linear-gradient(135deg, #a18cd1, #fbc2eb);
      transform: rotateY(180deg);
      color: #fff;
    }

    .card-chinese {
      font-size: 5rem;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 8px;
    }

    .card-pinyin {
      font-size: 1.5rem;
      color: #e44d6e;
      margin-bottom: 6px;
    }



    .listen-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.6rem;
      opacity: 0.5;
      transition: opacity 0.2s, transform 0.2s;
      padding: 4px;
      line-height: 1;
    }

    .listen-btn:hover { opacity: 1; transform: scale(1.15); }
    .card-back .listen-btn { color: #fff; }

    .card-illust {
      width: 80px;
      height: 80px;
      margin-bottom: 6px;
      object-fit: contain;
    }

    .card-back .card-chinese { color: #fff; font-size: 2.2rem; margin-bottom: 2px; }
    .card-back .card-english {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .card-back .card-pinyin { color: rgba(255,255,255,0.85); margin-bottom: 16px; }

    .card-back .card-actions {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .card-back .card-actions .btn {
      padding: 10px 22px;
      font-size: 0.95rem;
    }

    /* Buttons */
    .btn {
      border: none;
      border-radius: 50px;
      padding: 14px 32px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.15); }
    .btn:active { transform: translateY(0); }

    .btn-know { background: #4ecdc4; color: #fff; }
    .btn-dont-know { background: #ff6b6b; color: #fff; }
    .btn-next { background: #e44d6e; color: #fff; }

    /* Level progress bar */
    .level-bar-wrap {
      width: 320px;
      height: 10px;
      background: rgba(255,255,255,0.5);
      border-radius: 10px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .level-bar {
      height: 100%;
      background: linear-gradient(90deg, #4ecdc4, #44b09e);
      border-radius: 10px;
      transition: width 0.5s ease;
    }

    .review-tag {
      position: absolute;
      top: 16px;
      left: 16px;
      background: #ff6b6b;
      color: #fff;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card-back .review-tag {
      background: rgba(255,255,255,0.3);
    }

    /* Reward overlay */
    .reward-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .reward-overlay.show { display: flex; }

    .reward-box {
      background: #fff;
      border-radius: 30px;
      padding: 40px;
      text-align: center;
      max-width: 360px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    .reward-picture {
      font-size: 8rem;
      line-height: 1;
      margin-bottom: 10px;
    }

    .reward-title {
      font-size: 1.8rem;
      font-weight: 800;
      color: #e44d6e;
      margin-bottom: 6px;
    }

    .reward-msg {
      font-size: 1.1rem;
      color: #666;
      margin-bottom: 20px;
    }

    /* Confetti */
    .confetti {
      position: fixed;
      top: -10px;
      z-index: 101;
      font-size: 1.8rem;
      animation: fall linear forwards;
      pointer-events: none;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    /* Responsive */
    @media (max-width: 400px) {
      .card-container { width: 280px; height: 340px; }
      .card-chinese { font-size: 4rem; }
      .level-bar-wrap { width: 280px; }
      h1 { font-size: 1.7rem; }
    }
  </style>
</head>
<body>

  <h1>Learn Chinese! 学中文</h1>
  <p class="subtitle">Endless Mode - Tap to flip!</p>

  <div class="stats">
    <div class="stat-box"><span class="label">Level</span><br><span class="value" id="level">1</span></div>
    <div class="stat-box"><span class="label">Score</span><br><span class="value" id="score">0</span></div>
    <div class="stat-box"><span class="label">Streak</span><br><span class="streak-fire" id="streak">0 🔥</span></div>
  </div>

  <div class="level-bar-wrap">
    <div class="level-bar" id="levelBar" style="width: 0%"></div>
  </div>

  <div class="card-container" id="cardContainer">
    <div class="card" id="card">
      <div class="card-face card-front">
        <div class="review-tag" id="reviewTagFront" style="display:none">Review</div>
        <button class="listen-btn" onclick="event.stopPropagation(); speakWord()">&#x1f50a;</button>
        <div class="card-chinese" id="cardChinese"></div>
      </div>
      <div class="card-face card-back">
        <div class="review-tag" id="reviewTagBack" style="display:none">Review</div>
        <button class="listen-btn" onclick="event.stopPropagation(); speakWord()">&#x1f50a;</button>
        <img class="card-illust" id="cardIllust" alt="">
        <div class="card-english" id="cardEnglish"></div>
        <div class="card-chinese" id="cardChineseBack"></div>
        <div class="card-pinyin" id="cardPinyinBack"></div>
        <div class="card-actions">
          <button class="btn btn-know" onclick="event.stopPropagation(); answer(true)">I knew it!</button>
          <button class="btn btn-dont-know" onclick="event.stopPropagation(); answer(false)">Still learning</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Reward overlay -->
  <div class="reward-overlay" id="rewardOverlay">
    <div class="reward-box">
      <div class="reward-picture" id="rewardPic"></div>
      <div class="reward-title" id="rewardTitle"></div>
      <div class="reward-msg" id="rewardMsg"></div>
      <button class="btn btn-next" onclick="closeReward()">Keep going! →</button>
    </div>
  </div>


<script>
  // --- Sound engine (Web Audio API) ---
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  function playTone(freq, duration, type, gain) {
    const osc = audioCtx.createOscillator();
    const vol = audioCtx.createGain();
    osc.type = type || "sine";
    osc.frequency.value = freq;
    vol.gain.value = gain || 0.3;
    vol.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(vol);
    vol.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  }

  function playDing() {
    playTone(880, 0.15, "sine", 0.3);
    setTimeout(() => playTone(1320, 0.3, "sine", 0.25), 100);
  }

  function playBuzz() {
    playTone(200, 0.12, "square", 0.15);
    setTimeout(() => playTone(150, 0.2, "square", 0.12), 80);
  }

  function playMeow() {
    const osc = audioCtx.createOscillator();
    const vol = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(700, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(500, audioCtx.currentTime + 0.3);
    osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.5);
    vol.gain.setValueAtTime(0.3, audioCtx.currentTime);
    vol.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
    osc.connect(vol); vol.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.5);
  }

  function playWoof() {
    const osc = audioCtx.createOscillator();
    const vol = audioCtx.createGain();
    osc.type = "sawtooth";
    osc.frequency.setValueAtTime(250, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(180, audioCtx.currentTime + 0.15);
    vol.gain.setValueAtTime(0.25, audioCtx.currentTime);
    vol.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    osc.connect(vol); vol.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    setTimeout(() => {
      const o2 = audioCtx.createOscillator();
      const v2 = audioCtx.createGain();
      o2.type = "sawtooth";
      o2.frequency.setValueAtTime(230, audioCtx.currentTime);
      o2.frequency.linearRampToValueAtTime(160, audioCtx.currentTime + 0.18);
      v2.gain.setValueAtTime(0.2, audioCtx.currentTime);
      v2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.25);
      o2.connect(v2); v2.connect(audioCtx.destination);
      o2.start(); o2.stop(audioCtx.currentTime + 0.25);
    }, 200);
  }

  function playChirp() {
    const osc = audioCtx.createOscillator();
    const vol = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(2000, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(3500, audioCtx.currentTime + 0.05);
    osc.frequency.linearRampToValueAtTime(2500, audioCtx.currentTime + 0.1);
    vol.gain.setValueAtTime(0.2, audioCtx.currentTime);
    vol.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
    osc.connect(vol); vol.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
    setTimeout(() => {
      const o2 = audioCtx.createOscillator();
      const v2 = audioCtx.createGain();
      o2.type = "sine";
      o2.frequency.setValueAtTime(2200, audioCtx.currentTime);
      o2.frequency.linearRampToValueAtTime(3800, audioCtx.currentTime + 0.06);
      v2.gain.setValueAtTime(0.18, audioCtx.currentTime);
      v2.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
      o2.connect(v2); v2.connect(audioCtx.destination);
      o2.start(); o2.stop(audioCtx.currentTime + 0.1);
    }, 130);
  }

  function playSplash() {
    for (let i = 0; i < 5; i++) {
      setTimeout(() => {
        const osc = audioCtx.createOscillator();
        const vol = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = 200 + Math.random() * 800;
        vol.gain.setValueAtTime(0.1, audioCtx.currentTime);
        vol.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
        osc.connect(vol); vol.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.08);
      }, i * 30);
    }
  }

  function playWhoosh() {
    const osc = audioCtx.createOscillator();
    const vol = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
    vol.gain.setValueAtTime(0.15, audioCtx.currentTime);
    vol.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
    osc.connect(vol); vol.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.3);
  }

  function playCrackle() {
    for (let i = 0; i < 8; i++) {
      setTimeout(() => {
        const osc = audioCtx.createOscillator();
        const vol = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.value = 100 + Math.random() * 300;
        vol.gain.setValueAtTime(0.08, audioCtx.currentTime);
        vol.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.06);
        osc.connect(vol); vol.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.06);
      }, i * 40);
    }
  }

  function playRing() {
    playTone(1200, 0.1, "sine", 0.2);
    setTimeout(() => playTone(1500, 0.1, "sine", 0.15), 100);
    setTimeout(() => playTone(1200, 0.15, "sine", 0.1), 200);
  }

  function playMunch() {
    for (let i = 0; i < 3; i++) {
      setTimeout(() => {
        playTone(300 + i * 50, 0.06, "square", 0.12);
      }, i * 80);
    }
  }

  function playGulp() {
    const osc = audioCtx.createOscillator();
    const vol = audioCtx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(500, audioCtx.currentTime);
    osc.frequency.linearRampToValueAtTime(200, audioCtx.currentTime + 0.15);
    vol.gain.setValueAtTime(0.2, audioCtx.currentTime);
    vol.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
    osc.connect(vol); vol.connect(audioCtx.destination);
    osc.start(); osc.stop(audioCtx.currentTime + 0.2);
  }

  function playSteps() {
    for (let i = 0; i < 4; i++) {
      setTimeout(() => playTone(100 + (i % 2) * 40, 0.05, "square", 0.1), i * 100);
    }
  }

  const soundFns = { meow: playMeow, woof: playWoof, chirp: playChirp, splash: playSplash, whoosh: playWhoosh, crackle: playCrackle, ring: playRing, munch: playMunch, gulp: playGulp, steps: playSteps };

  function playWordSound(key) {
    if (key && soundFns[key]) {
      if (audioCtx.state === "suspended") audioCtx.resume();
      soundFns[key]();
    }
  }

    5: [
      { chinese: "飞机", pinyin: "fēi jī", english: "Airplane", icon: "airplane", sound: "whoosh" },
      { chinese: "图书馆", pinyin: "tú shū guǎn", english: "Library", icon: "books" },
      { chinese: "动物园", pinyin: "dòng wù yuán", english: "Zoo", icon: "lion" },
      { chinese: "巧克力", pinyin: "qiǎo kè lì", english: "Chocolate", icon: "chocolate-bar", sound: "munch" },
      { chinese: "西瓜", pinyin: "xī guā", english: "Watermelon", icon: "watermelon", sound: "munch" },
      { chinese: "聪明", pinyin: "cōng míng", english: "Smart", icon: "brain" },
      { chinese: "勇敢", pinyin: "yǒng gǎn", english: "Brave", icon: "man-superhero" },
      { chinese: "认真", pinyin: "rèn zhēn", english: "Serious", icon: "nerd-face" },
      { chinese: "练习", pinyin: "liàn xí", english: "Practice", icon: "pencil" },
      { chinese: "冒险", pinyin: "mào xiǎn", english: "Adventure", icon: "world-map" },
      { chinese: "厨房", pinyin: "chú fáng", english: "Kitchen", icon: "man-cook" },
      { chinese: "钢琴", pinyin: "gāng qín", english: "Piano", icon: "musical-keyboard" },
      { chinese: "恐龙", pinyin: "kǒng lóng", english: "Dinosaur", icon: "t-rex" },
      { chinese: "蝴蝶", pinyin: "hú dié", english: "Butterfly", icon: "butterfly" },
      { chinese: "彩虹", pinyin: "cǎi hóng", english: "Rainbow", icon: "rainbow" },
    ],
  };

  // Silly reward pictures & messages
  const rewards = [
    { pic: "🦄", title: "Unicorn Power!", msg: "You unlocked a magical unicorn!" },
    { pic: "🐸", title: "Frog Prince!", msg: "Ribbit! You're doing great!" },
    { pic: "🦖", title: "Dino Genius!", msg: "RAWR means 'great job' in dinosaur!" },
    { pic: "🐙", title: "Octopus High-Five!", msg: "That's 8 high-fives at once!" },
    { pic: "🤪", title: "Silly Face!", msg: "You earned a silly face! Bleh!" },
    { pic: "🦩", title: "Flamingo Dance!", msg: "This flamingo is dancing for you!" },
    { pic: "🐵", title: "Monkey Business!", msg: "Ooh ooh ahh ahh! Smart monkey!" },
    { pic: "🦊", title: "Foxy Scholar!", msg: "Clever as a fox, you are!" },
    { pic: "🐋", title: "Whale of a Job!", msg: "Even the whales are impressed!" },
    { pic: "🦜", title: "Parrot Party!", msg: "Polly says you're awesome!" },
    { pic: "🐲", title: "Dragon Master!", msg: "The dragon bows to your wisdom!" },
    { pic: "🧜‍♂️", title: "Merman Mode!", msg: "Splashing through these words!" },
    { pic: "👽", title: "Alien Genius!", msg: "Even aliens are learning from you!" },
    { pic: "🤖", title: "Robo-Star!", msg: "Beep boop, you're amazing!" },
    { pic: "🧙‍♂️", title: "Word Wizard!", msg: "You cast a spell of smartness!" },
  ];

  const levelNames = ["", "Beginner", "Easy", "Medium", "Hard", "Expert"];
  const confettiChars = ["🎉", "⭐", "🌟", "💫", "🎊", "✨", "🎈", "❤️", "🧡", "💛"];

  // --- Game state ---
  let playerLevel = 1;       // Current difficulty 1-5
  let levelProgress = 0;     // Progress toward next level (0-4, need 5 correct to level up)
  let score = 0;
  let streak = 0;
  let cardsPlayed = 0;

  // Spaced repetition: words got wrong, scheduled for review
  // Each entry: { word, reviewAfter (cardNumber when to show it) }
  let reviewQueue = [];
  let currentWord = null;
  let isReviewCard = false;

  // Track which words have been seen per level so we don't repeat too soon
  let seenPerLevel = { 1: [], 2: [], 3: [], 4: [], 5: [] };

  function pickWord() {
    // Check if any review words are due
    const dueReviews = reviewQueue.filter(r => cardsPlayed >= r.reviewAfter);
    if (dueReviews.length > 0) {
      // Pick the oldest due review
      const review = dueReviews[0];
      reviewQueue = reviewQueue.filter(r => r !== review);
      isReviewCard = true;
      return review.word;
    }

    isReviewCard = false;

    // Adaptive: mostly pick from current level, sometimes from adjacent
    let level = playerLevel;
    const roll = Math.random();
    if (roll < 0.15 && playerLevel > 1) {
      level = playerLevel - 1; // 15% chance easier
    } else if (roll < 0.25 && playerLevel < 5) {
      level = playerLevel + 1; // 10% chance harder preview
    }

    const pool = wordBank[level];
    const seen = seenPerLevel[level];

    // Pick unseen words first, reset if all seen
    const unseen = pool.filter(w => !seen.includes(w.chinese));
    if (unseen.length === 0) {
      seenPerLevel[level] = [];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    const word = unseen[Math.floor(Math.random() * unseen.length)];
    seen.push(word.chinese);
    return word;
  }

  function showCard() {
    currentWord = pickWord();
    // Update front immediately (it's hidden during flip)
    document.getElementById("cardChinese").textContent = currentWord.chinese;

    // Flip to front first
    const card = document.getElementById("card");
    card.classList.remove("flipped");

    // Update back content after flip animation completes (0.6s)
    setTimeout(() => {
      document.getElementById("cardChineseBack").textContent = currentWord.chinese;
      document.getElementById("cardPinyinBack").textContent = currentWord.pinyin;
      document.getElementById("cardEnglish").textContent = currentWord.english;
      const img = document.getElementById("cardIllust");
      if (currentWord.icon) {
        img.src = ICON_BASE + currentWord.icon + ".svg?height=96";
        img.style.display = "";
      } else {
        img.style.display = "none";
      }
      // Show/hide review tag
      const show = isReviewCard ? "" : "none";
      document.getElementById("reviewTagFront").style.display = show;
      document.getElementById("reviewTagBack").style.display = show;
    }, 650);
  }

  function updateStats() {
    document.getElementById("score").textContent = score;
    document.getElementById("level").textContent = playerLevel;
    document.getElementById("streak").textContent = streak + " 🔥";
    const pct = (levelProgress / 5) * 100;
    document.getElementById("levelBar").style.width = pct + "%";
  }

  // Flip card on tap
  document.getElementById("cardContainer").addEventListener("click", () => {
    const card = document.getElementById("card");
    const wasFlipped = card.classList.contains("flipped");
    card.classList.toggle("flipped");
    // Play word-specific sound when flipping to back
    if (!wasFlipped && currentWord.sound) {
      if (audioCtx.state === "suspended") audioCtx.resume();
      setTimeout(() => playWordSound(currentWord.sound), 300);
    }
  });

  function answer(knew) {
    if (audioCtx.state === "suspended") audioCtx.resume();
    cardsPlayed++;

    if (knew) {
      score++;
      streak++;
      playDing();

      // Level up progress
      levelProgress++;
      if (levelProgress >= 5 && playerLevel < 5) {
        playerLevel++;
        levelProgress = 0;
        showLevelUp();
      } else if (levelProgress >= 5) {
        levelProgress = 5; // Cap at max level
      }

      // Reward every 5 streak
      if (streak > 0 && streak % 5 === 0) {
        showReward();
      }
    } else {
      streak = 0;
      playBuzz();

      // Level down progress (but don't go below 0 or drop level too fast)
      levelProgress = Math.max(0, levelProgress - 1);

      // If at 0 progress and keep getting wrong, drop a level
      if (levelProgress === 0 && playerLevel > 1) {
        // Only drop if they got the last 2 wrong (be gentle)
        playerLevel--;
        levelProgress = 3; // Start partway through the lower level
      }

      // Schedule this word for review: come back after 3-6 cards
      const delay = 3 + Math.floor(Math.random() * 4);
      reviewQueue.push({
        word: { ...currentWord },
        reviewAfter: cardsPlayed + delay,
      });
    }

    updateStats();
    showCard();
  }

  function showLevelUp() {
    const r = {
      pic: ["🌟", "🚀", "⚡", "🏆", "👑"][playerLevel - 1] || "🌟",
      title: "Level " + playerLevel + "!",
      msg: "You reached " + levelNames[playerLevel] + " difficulty!"
    };
    document.getElementById("rewardPic").textContent = r.pic;
    document.getElementById("rewardTitle").textContent = r.title;
    document.getElementById("rewardMsg").textContent = r.msg;
    document.getElementById("rewardOverlay").classList.add("show");
    spawnConfetti();
  }

  function showReward() {
    const r = rewards[Math.floor(Math.random() * rewards.length)];
    document.getElementById("rewardPic").textContent = r.pic;
    document.getElementById("rewardTitle").textContent = r.title;
    document.getElementById("rewardMsg").textContent = r.msg;
    document.getElementById("rewardOverlay").classList.add("show");
    spawnConfetti();
  }

  function closeReward() {
    document.getElementById("rewardOverlay").classList.remove("show");
  }

  function spawnConfetti() {
    for (let i = 0; i < 30; i++) {
      const el = document.createElement("div");
      el.classList.add("confetti");
      el.textContent = confettiChars[Math.floor(Math.random() * confettiChars.length)];
      el.style.left = Math.random() * 100 + "vw";
      el.style.animationDuration = (2 + Math.random() * 3) + "s";
      el.style.animationDelay = Math.random() * 1 + "s";
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 6000);
    }
  }

  function speakWord() {
    const utterance = new SpeechSynthesisUtterance(currentWord.chinese);
    utterance.lang = "zh-CN";
    utterance.rate = 0.8;
    speechSynthesis.speak(utterance);
  }

  // Start!
  updateStats();
  showCard();
</script>

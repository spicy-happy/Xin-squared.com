                          <h3 className="font-bold text-lg text-center">
                            {firstDay && lastDay ? `${formatDate(firstDay)} - ${formatDate(lastDay)}` : 'No data'}
                          </h3>
                          <button onClick={() => setWeekOffset(weekOffset + 1)} disabled={weekOffset >= 0} className="px-4 py-2 bg-gray-100 rounded-xl hover:bg-gray-200 disabled:opacity-30 text-xl font-bold">&rarr;</button>
                        </div>
                        <div className="grid grid-cols-2 gap-3 mb-4">
                          <div className="bg-blue-50 rounded-xl p-3">
                            <div className="text-xs font-bold text-gray-600">AVG DAILY CALORIES</div>
                            <div className="text-2xl font-bold text-blue-600">{avgCals.toFixed(0)}</div>
                            <div className="text-xs text-gray-500">Goal: {baseGoalMin}</div>
                          </div>
                          <div className="bg-green-50 rounded-xl p-3">
                            <div className="text-xs font-bold text-gray-600">AVG DAILY PROTEIN</div>
                            <div className="text-2xl font-bold text-green-600">{avgProtein.toFixed(0)}g</div>
                            <div className="text-xs text-gray-500">Goal: {proteinGoal}g</div>
                          </div>
                        </div>
                        {daysWithData.length > 0 && (
                          <div className="text-xs text-center text-gray-500 mb-4">
                            Based on {daysWithData.length} day{daysWithData.length !== 1 ? 's' : ''} with data
                          </div>
                        )}
                        <WeightChart data={weekData.map(d => ({
                          label: formatDateWithWeekday(d.date).split(',')[0],
                          weight: d.weight ? parseFloat(displayWeight(d.weight)) : null
                        }))} unit={weightLabel} targetWeight={userProfile.targetWeight ? parseFloat(displayWeight(userProfile.targetWeight)) : null} startingWeight={userProfile.startingWeight ? parseFloat(displayWeight(userProfile.startingWeight)) : null} lastKnownWeight={(() => {
                          const w = getLastKnownWeight(weekData[0]?.date);
                          return w ? parseFloat(displayWeight(w)) : null;
                        })()} />
                        <div className="space-y-2">
                          {weekData.map((day) => {
                            const hasFoods = (day.foods || []).length > 0;
                            const dayCals = (day.foods || []).reduce((sum, f) => sum + f.calories, 0);
                            const dayProtein = (day.foods || []).reduce((sum, f) => sum + f.protein, 0);
                            const exerciseCals = (day.exercises || []).reduce((sum, e) => sum + e.calories, 0);
                            const dayCalGoalMin = baseGoalMin + exerciseCals;
                            const dayCalGoalMax = baseGoalMax + exerciseCals;
                            return (
                              <div key={day.date} className="bg-gray-50 p-4 rounded-xl cursor-pointer hover:bg-gray-100 transition-colors" onClick={() => { setCurrentDate(day.date); setSummaryView('day'); }}>
                                <div className="flex justify-between items-center mb-2">
                                  <div className="flex items-center gap-2">
                                    <div className="font-bold text-sm text-gray-700 uppercase">{formatDateWithWeekday(day.date)}</div>
                                    {userProfile.periodTracking && day.isPeriod && <div className="w-2 h-2 rounded-full bg-pink-500" title="Period"></div>}
                                  </div>
                                  {day.weight && <div className="text-sm text-gray-600">{displayWeight(day.weight)} {weightLabel}</div>}
                                </div>
                                {hasFoods ? (
                                  <div className="flex gap-4 text-sm">
                                    <div>
                                      <span className="text-gray-600">Calories:</span>{' '}
                                      <span className="font-bold text-blue-600">{dayCals.toFixed(0)}</span>
                                      <span className="text-gray-500 text-xs"> / {dayCalGoalMin}</span>
                                    </div>
                                    <div>
                                      <span className="text-gray-600">Protein:</span>{' '}
                                      <span className="font-bold text-green-600">{dayProtein.toFixed(0)}g</span>
                                      <span className="text-gray-500 text-xs"> / {proteinGoal}g</span>
                                    </div>
                                  </div>
                                ) : (
                                  <div className="text-sm text-gray-400 italic">No data</div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </>
                    );
                  })()}
                </div>
              )}

              {summaryView === 'month' && (
                <div>
                  {(() => {
                    const monthData = getMonthData();
                    const daysWithData = monthData.filter(d => d.weight || (d.foods && d.foods.length > 0));
                    const weights = daysWithData.filter(d => d.weight).map(d => parseFloat(d.weight));
                    const avgWeight = weights.length > 0 ? weights.reduce((a, b) => a + b, 0) / weights.length : 0;
                    const today = new Date();
                    const targetMonth = new Date(today.getFullYear(), today.getMonth() + monthOffset, 1);
                    const isFutureMonth = monthOffset > 0;
                    const predictedPeriods = getPredictedPeriods(targetMonth.getMonth(), targetMonth.getFullYear());
                    return (
                      <>
                        <div className="flex items-center justify-between mb-4">
                          <button onClick={() => setMonthOffset(monthOffset - 1)} className="px-4 py-2 bg-gray-100 rounded-xl hover:bg-gray-200 text-xl font-bold">&larr;</button>
                          <h3 className="font-bold text-lg text-center">
                            {targetMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}
                          </h3>
                          <button onClick={() => setMonthOffset(monthOffset + 1)} className="px-4 py-2 bg-gray-100 rounded-xl hover:bg-gray-200 text-xl font-bold">&rarr;</button>
                        </div>
                        <div className="grid grid-cols-2 gap-4 mb-4">
                          <div className="bg-purple-50 rounded-xl p-4">
                            <div className="text-center">
                              <div className="text-sm font-bold text-gray-600">DAYS LOGGED</div>
                              <div className="text-3xl font-bold text-purple-600">{daysWithData.length}</div>
                            </div>
                          </div>
                          <div className="bg-blue-50 rounded-xl p-4">
                            <div className="text-center">
                              <div className="text-sm font-bold text-gray-600">AVG WEIGHT</div>
                              <div className="text-3xl font-bold text-blue-600">
                                {avgWeight > 0 ? avgWeight.toFixed(1) : '--'}
                              </div>
                            </div>
                          </div>
                        </div>

                        <WeightChart data={monthData.map(d => ({
                          label: String(parseInt(d.date.split('-')[2])),
                          weight: d.weight ? parseFloat(displayWeight(d.weight)) : null
                        }))} height={220} unit={weightLabel} targetWeight={userProfile.targetWeight ? parseFloat(displayWeight(userProfile.targetWeight)) : null} startingWeight={userProfile.startingWeight ? parseFloat(displayWeight(userProfile.startingWeight)) : null} lastKnownWeight={(() => {
                          const w = getLastKnownWeight(monthData[0]?.date);
                          return w ? parseFloat(displayWeight(w)) : null;
                        })()} />

                        {userProfile.periodTracking && isFutureMonth && predictedPeriods.length > 0 && (
                          <div className="mb-4 p-3 bg-pink-50 border border-pink-200 rounded-xl text-sm text-center">
                            <span className="text-pink-700">Future month with predicted periods</span>
                          </div>
                        )}

                        <div className="grid grid-cols-7 gap-1 mb-4">
                          {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(day => (
                            <div key={day} className="text-center text-xs font-semibold text-gray-600 p-1">{day}</div>
                          ))}
                          {(() => {
                            const firstDay = new Date(targetMonth.getFullYear(), targetMonth.getMonth(), 1).getDay();
                            const blanks = Array(firstDay === 0 ? 6 : firstDay - 1).fill(null);
                            return (
                              <>
                                {blanks.map((_, i) => <div key={`blank-${i}`} className="aspect-square" />)}
                                {monthData.map((day) => {
                                  const hasData = day.weight || (day.foods && day.foods.length > 0);
                                  const isPeriodDay = day.isPeriod;
                                  const isPredictedPeriod = predictedPeriods.includes(day.date);
                                  const dayNum = parseInt(day.date.split('-')[2]);
                                  const totalCalsDay = (day.foods || []).reduce((sum, f) => sum + f.calories, 0);
                                  const totalProteinDay = (day.foods || []).reduce((sum, f) => sum + f.protein, 0);
                                  const exerciseCalsDay = (day.exercises || []).reduce((sum, e) => sum + e.calories, 0);
                                  const calorieGoalDay = baseGoalMin + exerciseCalsDay;
                                  const hasFoodOrExercise = (day.foods || []).length > 0 || (day.exercises || []).length > 0;
                                  const calorieGoalMaxDay = baseGoalMax + exerciseCalsDay;
                                  const belowCalories = hasFoodOrExercise && totalCalsDay < calorieGoalDay;
                                  const aboveCalories = hasFoodOrExercise && totalCalsDay > calorieGoalMaxDay;
                                  const aboveProtein = hasData && totalProteinDay > proteinGoal;
                                  let bgColor = 'bg-gray-50 text-gray-400';
                                  if (hasData) bgColor = 'bg-white border-2 border-gray-300 text-gray-900 font-medium';
                                  return (
                                    <div key={day.date} className={`aspect-square flex flex-col items-center justify-center text-sm rounded-lg ${bgColor} relative cursor-pointer hover:ring-2 hover:ring-blue-400 transition-all`} onClick={() => { setCurrentDate(day.date); setSummaryView('day'); }}>
                                      <div>{dayNum}</div>
                                      <div className="flex gap-0.5 mt-0.5">
                                        {userProfile.periodTracking && isPeriodDay && <div className="w-1.5 h-1.5 rounded-full bg-pink-500"></div>}
                                        {userProfile.periodTracking && isPredictedPeriod && <div className="w-1.5 h-1.5 rounded-full bg-pink-300"></div>}
                                        {belowCalories && <span className="text-green-500 text-[8px] leading-none font-bold">✓</span>}
                                        {aboveProtein && <div className="w-0 h-0 border-l-[3px] border-l-transparent border-r-[3px] border-r-transparent border-b-[4px] border-b-green-500"></div>}
                                      </div>
                                    </div>
                                  );
                                })}
                              </>
                            );
                          })()}
                        </div>

                        <div className="bg-gray-50 rounded-xl p-3 text-xs">
                          <div className="flex flex-wrap gap-x-4 gap-y-1 justify-center">
                            <div className="flex items-center gap-1.5">
                              <span className="text-green-500 text-[10px] font-bold">✓</span>
                              <span className="text-gray-600">Below Cal Goal</span>
                            </div>
                            <div className="flex items-center gap-1.5">
                              <div className="w-0 h-0 border-l-[4px] border-l-transparent border-r-[4px] border-r-transparent border-b-[5px] border-b-green-500"></div>
                              <span className="text-gray-600">Above Protein Goal</span>
                            </div>
                            {userProfile.periodTracking && (
                              <div className="flex items-center gap-1.5">
                                <div className="w-2 h-2 rounded-full bg-pink-500"></div>
                                <span className="text-gray-600">Period</span>
                              </div>
                            )}
                            {userProfile.periodTracking && (
                              <div className="flex items-center gap-1.5">
                                <div className="w-2 h-2 rounded-full bg-pink-300"></div>
                                <span className="text-gray-600">Predicted</span>
                              </div>
                            )}
                          </div>
                        </div>
                      </>
                    );
                  })()}
                </div>
              )}
            </div>
          </div>
        )}

        {activeTab === 'profile' && (
          <div className="space-y-4">
            <div className="bg-white rounded-2xl shadow-lg p-6">
              <h2 className="text-2xl font-bold mb-4">My Goal</h2>
              <textarea
                value={goal}
                onChange={(e) => {
                  setGoal(e.target.value);
                  saveGoal(e.target.value);
                }}
                placeholder="Reach 137 lbs by summer"
                className="w-full px-4 py-3 border rounded-xl resize-none"
                rows={Math.max(3, goal.split('\n').length)}
              />
              {isCalculatingGoals && (
                <div className="text-xs text-blue-600 mt-2">Updating calorie/protein targets...</div>
              )}
              {nutritionGoals && (
                <div className="mt-3 p-3 bg-blue-50 rounded-xl">
                  <div className="text-xs font-bold text-gray-600 mb-1">AI-RECOMMENDED TARGETS</div>
                  <div className="text-sm text-gray-700">
                    <span className="font-semibold text-blue-600">{nutritionGoals.calorieMin}</span> cal/day,
                    <span className="font-semibold text-green-600 ml-1">{nutritionGoals.protein}g</span> protein/day
                  </div>
                  <button
                    onClick={() => calculateNutritionGoals(userProfile, goal)}
                    disabled={isCalculatingGoals || !apiKey}
                    className="mt-2 px-3 py-1.5 bg-blue-100 text-blue-700 rounded-lg text-xs font-semibold disabled:opacity-50"
                  >
                    {isCalculatingGoals ? 'Calculating...' : 'Recalculate Targets'}
                  </button>
                </div>
              )}
            </div>

            <div className="bg-white rounded-2xl shadow-lg p-6">
              <h2 className="text-2xl font-bold mb-4">Information</h2>
              <div className="space-y-4">
                <div>
                  <label className="block text-sm font-bold mb-2">UNITS</label>
                  <div className="flex gap-2">
                    <button
                      onClick={() => switchUnitSystem('standard')}
                      className={`flex-1 px-4 py-2 rounded-xl font-semibold text-sm ${!isMetric ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600'}`}
                    >US Standard</button>
                    <button
                      onClick={() => switchUnitSystem('metric')}
                      className={`flex-1 px-4 py-2 rounded-xl font-semibold text-sm ${isMetric ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600'}`}
                    >Metric</button>
                  </div>
                </div>
                <div>
                  <label className="block text-sm font-bold mb-2">GENDER</label>
                  <div className="flex gap-2">
                    {['female', 'male', 'other'].map(g => (
                      <button
                        key={g}
                        onClick={() => {
                          const p = {...userProfile, gender: g};
                          setUserProfile(p); saveUserProfile(p);
                        }}
                        className={`flex-1 px-4 py-2 rounded-xl font-semibold text-sm capitalize ${userProfile.gender === g ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600'}`}
                      >{g}</button>
                    ))}
                  </div>
                </div>
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm font-bold mb-2">STARTING WEIGHT</label>
                    <div className="relative">
                      <input
                        type="number"
                        step="0.1"
                        value={userProfile.startingWeight ? (isMetric ? (parseFloat(userProfile.startingWeight) * 0.453592).toFixed(1) : userProfile.startingWeight) : ''}
                        onChange={(e) => {
                          const val = e.target.value;
                          if (val === '') { const p = {...userProfile, startingWeight: ''}; setUserProfile(p); saveUserProfile(p); return; }
                          const lbsVal = isMetric ? (parseFloat(val) / 0.453592).toFixed(1) : val;
                          const p = {...userProfile, startingWeight: lbsVal};
                          setUserProfile(p); saveUserProfile(p);
                        }}
                        className="w-full px-4 py-3 pr-12 border rounded-xl"
                      />
                      <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm">{weightLabel}</span>
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-bold mb-2">TARGET WEIGHT</label>
                    <div className="relative">
                      <input
                        type="number"
                        step="0.1"
                        value={userProfile.targetWeight ? (isMetric ? (parseFloat(userProfile.targetWeight) * 0.453592).toFixed(1) : userProfile.targetWeight) : ''}
                        onChange={(e) => {
                          const val = e.target.value;
                          if (val === '') { const p = {...userProfile, targetWeight: ''}; setUserProfile(p); saveUserProfile(p); return; }
                          const lbsVal = isMetric ? (parseFloat(val) / 0.453592).toFixed(1) : val;
                          const p = {...userProfile, targetWeight: lbsVal};
                          setUserProfile(p); saveUserProfile(p);
                        }}
                        className="w-full px-4 py-3 pr-12 border rounded-xl"
                      />
                      <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm">{weightLabel}</span>
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-bold mb-2">BIRTH YEAR</label>
                    <input
                      type="number"
                      value={userProfile.birthYear}
                      onChange={(e) => {
                        const p = {...userProfile, birthYear: e.target.value};
                        setUserProfile(p); saveUserProfile(p);
                      }}
                      className="w-full px-4 py-3 border rounded-xl"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-sm font-bold mb-2">HEIGHT</label>
                  {isMetric ? (
                    <div className="relative">
                      <input
                        type="number"
                        value={displayHeight(userProfile.heightFt, userProfile.heightIn) || ''}
                        onChange={(e) => {
                          const cm = parseFloat(e.target.value) || 0;
                          const totalInches = cm / 2.54;
                          const ft = Math.floor(totalInches / 12);
                          const inches = Math.round(totalInches % 12);
                          const p = {...userProfile, heightFt: String(ft), heightIn: String(inches)};
                          setUserProfile(p); saveUserProfile(p);
                        }}
                        placeholder="170"
                        className="w-full px-4 py-3 pr-12 border rounded-xl"
                      />
                      <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm">cm</span>
                    </div>
                  ) : (
                    <div className="grid grid-cols-2 gap-4">
                      <div className="relative">
                        <input
                          type="number"
                          value={userProfile.heightFt}
                          onChange={(e) => {
                            const p = {...userProfile, heightFt: e.target.value};
                            setUserProfile(p); saveUserProfile(p);
                          }}
                          className="w-full px-4 py-3 pr-12 border rounded-xl"
                        />
                        <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm">ft</span>
                      </div>
                      <div className="relative">
                        <input
                          type="number"
                          value={userProfile.heightIn}
                          onChange={(e) => {
                            const p = {...userProfile, heightIn: e.target.value};
                            setUserProfile(p); saveUserProfile(p);
                          }}
                          className="w-full px-4 py-3 pr-12 border rounded-xl"
                        />
                        <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm">in</span>
                      </div>
                    </div>
                  )}
                </div>

                <div>
                  <h3 className="text-lg font-bold mb-3">Period</h3>
                  <div className="space-y-4">
                    <div className="flex items-center justify-between">
                      <span className="text-sm">Period Tracking</span>
                      <input
                        type="checkbox"
                        checked={userProfile.periodTracking}
                        onChange={(e) => {
                          const p = {...userProfile, periodTracking: e.target.checked};
                          setUserProfile(p); saveUserProfile(p);
                        }}
                        className="w-6 h-6"
                      />
                    </div>
                    {userProfile.periodTracking && (
                      <div>
                        <label className="block text-sm font-bold mb-2">AVERAGE CYCLE LENGTH</label>
                        <div className="relative">
                          <input
                            type="number"
                            value={userProfile.cycleLength}
                            onChange={(e) => {
                              const p = {...userProfile, cycleLength: e.target.value};
                              setUserProfile(p); saveUserProfile(p);
                            }}
                            className="w-full px-4 py-3 pr-16 border rounded-xl"
                            placeholder="28" min="20" max="40"
                          />
                          <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm">days</span>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>

            <div className="bg-white rounded-2xl shadow-lg p-6">
              <h2 className="text-2xl font-bold mb-4">
                <span className="flex items-center gap-2">
                  Cloud Sync
                  {syncStatus === 'syncing' && <span className="text-sm font-normal text-blue-500">Syncing...</span>}
                  {syncStatus === 'synced' && <span className="text-sm font-normal text-green-500">Synced</span>}
                  {syncStatus === 'error' && <span className="text-sm font-normal text-red-500">Sync Error</span>}
                </span>
              </h2>
              <p className="text-sm text-gray-600 mb-4">
                Sync across your devices with end-to-end encryption. Your passphrase never leaves this device; the server only stores ciphertext.
              </p>

              {cloudMode === 'local' && (
                <button
                  onClick={() => setShowOnboarding(true)}
                  className="w-full px-6 py-3 bg-gradient-to-r from-blue-600 to-green-600 text-white rounded-xl font-semibold"
                >
                  Enable cloud sync
                </button>
              )}
              {cloudMode === 'cloud' && (
                <div className="space-y-2">
                  <button
                    onClick={() => window.dispatchEvent(new Event('ht-sync-now'))}
                    className="w-full px-4 py-2.5 bg-blue-100 text-blue-700 rounded-xl font-semibold text-sm"
                  >
                    Sync now
                  </button>
                  <button
                    onClick={() => setShowSettings(true)}
                    className="w-full px-4 py-2 bg-gray-100 text-gray-700 rounded-xl font-semibold text-sm"
                  >
                    Account & wipe options
                  </button>
                </div>
              )}
              {cloudMode === 'unset' && (
                <button
                  onClick={() => setShowOnboarding(true)}
                  className="w-full px-6 py-3 bg-gradient-to-r from-blue-600 to-green-600 text-white rounded-xl font-semibold"
                >
                  Set up sync
                </button>
              )}
            </div>

            <div className="bg-white rounded-2xl shadow-lg p-6">
              <h2 className="text-2xl font-bold mb-4">API Settings</h2>
              <div className="space-y-3">
                <div>
                  <label className="block text-sm font-bold mb-2">OPENAI API KEY</label>
                  <input
                    type="password"
                    value={apiKey}
                    onChange={(e) => {
                      setApiKey(e.target.value);
                      localStorage.setItem('openai-api-key', e.target.value);
                    }}
                    placeholder="sk-..."
                    className="w-full px-4 py-3 border rounded-xl"
                  />
                  <p className="text-xs text-gray-500 mt-2">
                    Stored locally in your browser. Never sent anywhere except OpenAI.
                  </p>
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={() => {
                      localStorage.removeItem('openai-api-key');
                      setApiKey('');
                      setShowApiKeyPrompt(true);
                    }}
                    className="flex-1 px-4 py-2 bg-red-100 text-red-700 rounded-xl font-semibold text-sm"
                  >
                    Remove Key
                  </button>
                  <a
                    href="https://platform.openai.com/api-keys"
                    target="_blank"
                    rel="noopener"
                    className="flex-1 px-4 py-2 bg-blue-100 text-blue-700 rounded-xl font-semibold text-sm text-center"
                  >
                    Get API Key
                  </a>
                </div>
              </div>
            </div>

            <div className="bg-white rounded-2xl shadow-lg p-6">
              <h2 className="text-2xl font-bold mb-4">Data Management</h2>
              <div className="space-y-3">
                <div>
                  <button
                    onClick={exportData}
                    className="w-full px-6 py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl hover:from-blue-700 hover:to-indigo-700 font-semibold shadow-lg flex items-center justify-center transition-colors mb-2"
                  >
                    <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Export Data
                  </button>
                </div>

                <div>
                  <input type="file" accept=".json" onChange={importData} id="import-data-input" className="hidden" />
                  <label
                    htmlFor="import-data-input"
                    className="w-full px-6 py-3.5 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-xl font-semibold shadow-lg flex items-center justify-center transition-colors cursor-pointer mb-2"
                  >
                    <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                    </svg>
                    Import Data
                  </label>
                </div>

                <div>
                  {!showClearConfirm ? (
                    <button
                      onClick={() => setShowClearConfirm(true)}
                      className="w-full px-6 py-3.5 bg-transparent border-2 border-red-600 text-red-600 rounded-xl hover:bg-red-50 font-semibold flex items-center justify-center transition-colors"
                    >
                      Clear Data
                    </button>
                  ) : (
                    <div className="p-4 bg-red-50 border-2 border-red-200 rounded-xl">
                      <div className="text-sm text-center text-red-700 font-bold mb-3">
                        Clear all data? This cannot be undone.
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <button onClick={() => setShowClearConfirm(false)} className="px-4 py-2 bg-white border-2 border-gray-300 text-gray-700 rounded-xl font-semibold transition-colors">Cancel</button>
                        <button onClick={clearData} className="px-4 py-2 bg-red-600 text-white rounded-xl font-semibold transition-colors">Clear All</button>
                      </div>
                    </div>
                  )}
                </div>

                {lastBackupDate && (
                  <p className="text-xs text-center text-gray-500 mt-3">
                    Last backup: {new Date(lastBackupDate).toLocaleDateString()} at {new Date(lastBackupDate).toLocaleTimeString()}
                  </p>
                )}
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Undo Popup */}
      {undoState && (
        <div className="fixed top-0 left-0 right-0 z-50">
          <div className="bg-gray-900 text-white py-3 px-4 flex items-center justify-between">
            <div className="font-medium text-sm">
              {undoState.type === 'food' ? undoState.item.name : undoState.item.type} deleted
            </div>
            <div className="flex items-center gap-4">
              <button onClick={undoDelete} className="text-white hover:text-gray-300 font-semibold text-sm underline">Undo</button>
              <button onClick={dismissUndo} className="text-gray-400 hover:text-white text-lg">X</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<HealthTracker />);
    </script>
</body>
</html>

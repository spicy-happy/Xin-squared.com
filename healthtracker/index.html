                                {hasFoods ? (
                                  <div className="flex gap-4 text-sm">
                                    <div>
                                      <span className="text-gray-600">Calories:</span>{' '}
                                      <span className="font-bold text-blue-600">{dayCals.toFixed(0)}</span>
                                      <span className="text-gray-500 text-xs"> / {dayCalGoalMin}-{dayCalGoalMax}</span>
                                    </div>
                                    <div>
                                      <span className="text-gray-600">Protein:</span>{' '}
                                      <span className="font-bold text-green-600">{dayProtein.toFixed(0)}g</span>
                                      <span className="text-gray-500 text-xs"> / {proteinGoal}g</span>
                                    </div>
                                  </div>
                                ) : (
                                  <div className="text-sm text-gray-400 italic">No data</div>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </>
                    );
                  })()}
                </div>
              )}

              {summaryView === 'month' && (
                <div>
                  {(() => {
                    const monthData = getMonthData();
                    const daysWithData = monthData.filter(d => d.weight || (d.foods && d.foods.length > 0));
                    const weights = daysWithData.filter(d => d.weight).map(d => parseFloat(d.weight));
                    const avgWeight = weights.length > 0 ? weights.reduce((a, b) => a + b, 0) / weights.length : 0;
                    const today = new Date();
                    const targetMonth = new Date(today.getFullYear(), today.getMonth() + monthOffset, 1);
                    const isFutureMonth = monthOffset > 0;
                    const predictedPeriods = getPredictedPeriods(targetMonth.getMonth(), targetMonth.getFullYear());
                    return (
                      <>
                        <div className="flex items-center justify-between mb-4">
                          <button onClick={() => setMonthOffset(monthOffset - 1)} className="px-4 py-2 bg-gray-100 rounded-xl hover:bg-gray-200 text-xl font-bold">&larr;</button>
                          <h3 className="font-bold text-lg text-center">
                            {targetMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}
                          </h3>
                          <button onClick={() => setMonthOffset(monthOffset + 1)} className="px-4 py-2 bg-gray-100 rounded-xl hover:bg-gray-200 text-xl font-bold">&rarr;</button>
                        </div>
                        <div className="grid grid-cols-2 gap-4 mb-4">
                          <div className="bg-purple-50 rounded-xl p-4">
                            <div className="text-center">
                              <div className="text-sm font-bold text-gray-600">DAYS LOGGED</div>
                              <div className="text-3xl font-bold text-purple-600">{daysWithData.length}</div>
                            </div>
                          </div>
                          <div className="bg-blue-50 rounded-xl p-4">
                            <div className="text-center">
                              <div className="text-sm font-bold text-gray-600">AVG WEIGHT</div>
                              <div className="text-3xl font-bold text-blue-600">
                                {avgWeight > 0 ? avgWeight.toFixed(1) : '--'}
                              </div>
                            </div>
                          </div>
                        </div>

                        {isFutureMonth && predictedPeriods.length > 0 && (
                          <div className="mb-4 p-3 bg-pink-50 border border-pink-200 rounded-xl text-sm text-center">
                            <span className="text-pink-700">Future month with predicted periods</span>
                          </div>
                        )}

                        <div className="grid grid-cols-7 gap-1 mb-4">
                          {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(day => (
                            <div key={day} className="text-center text-xs font-semibold text-gray-600 p-1">{day}</div>
                          ))}
                          {(() => {
                            const firstDay = new Date(targetMonth.getFullYear(), targetMonth.getMonth(), 1).getDay();
                            const blanks = Array(firstDay === 0 ? 6 : firstDay - 1).fill(null);
                            return (
                              <>
                                {blanks.map((_, i) => <div key={`blank-${i}`} className="aspect-square" />)}
                                {monthData.map((day) => {
                                  const hasData = day.weight || (day.foods && day.foods.length > 0);
                                  const isPeriodDay = day.isPeriod;
                                  const isPredictedPeriod = predictedPeriods.includes(day.date);
                                  const dayNum = new Date(day.date).getDate();
                                  const totalCalsDay = (day.foods || []).reduce((sum, f) => sum + f.calories, 0);
                                  const totalProteinDay = (day.foods || []).reduce((sum, f) => sum + f.protein, 0);
                                  const exerciseCalsDay = (day.exercises || []).reduce((sum, e) => sum + e.calories, 0);
                                  const calorieGoalDay = baseGoalMin + exerciseCalsDay;
                                  const belowCalories = hasData && totalCalsDay < calorieGoalDay;
                                  const aboveProtein = hasData && totalProteinDay > proteinGoal;
                                  let bgColor = 'bg-gray-50 text-gray-400';
                                  if (hasData) bgColor = 'bg-white border-2 border-gray-300 text-gray-900 font-medium';
                                  return (
                                    <div key={day.date} className={`aspect-square flex flex-col items-center justify-center text-sm rounded-lg ${bgColor} relative`}>
                                      <div>{dayNum}</div>
                                      {hasData && (
                                        <div className="flex gap-0.5 mt-0.5">
                                          {isPeriodDay && <div className="w-1.5 h-1.5 rounded-full bg-pink-500"></div>}
                                          {isPredictedPeriod && <div className="w-1.5 h-1.5 rounded-full bg-pink-300"></div>}
                                          {aboveProtein && <div className="w-0 h-0 border-l-[3px] border-l-transparent border-r-[3px] border-r-transparent border-b-[4px] border-b-green-500"></div>}
                                          {belowCalories && <div className="w-1.5 h-1.5 bg-blue-500"></div>}
                                        </div>
                                      )}
                                    </div>
                                  );
                                })}
                              </>
                            );
                          })()}
                        </div>

                        <div className="bg-gray-50 rounded-xl p-3 text-xs">
                          <div className="font-bold text-gray-700 mb-2">LEGEND</div>
                          <div className="grid grid-cols-2 gap-2">
                            <div className="flex items-center gap-2">
                              <div className="w-2 h-2 rounded-full bg-pink-500"></div>
                              <span className="text-gray-600">Period</span>
                            </div>
                            <div className="flex items-center gap-2">
                              <div className="w-2 h-2 rounded-full bg-pink-300"></div>
                              <span className="text-gray-600">Predicted Period</span>
                            </div>
                            <div className="flex items-center gap-2">
                              <div className="w-0 h-0 border-l-[4px] border-l-transparent border-r-[4px] border-r-transparent border-b-[5px] border-b-green-500"></div>
                              <span className="text-gray-600">Above {proteinGoal}g Protein</span>
                            </div>
                            <div className="flex items-center gap-2">
                              <div className="w-2 h-2 bg-blue-500"></div>
                              <span className="text-gray-600">Below Calorie Goal</span>
                            </div>
                          </div>
                        </div>
                      </>
                    );
                  })()}
                </div>
              )}
            </div>
          </div>
        )}

        {activeTab === 'profile' && (
          <div className="space-y-4">
            <div className="bg-white rounded-2xl shadow-lg p-6">
              <h2 className="text-2xl font-bold mb-4">My Goal</h2>
              <textarea
                value={goal}
                onChange={(e) => {
                  setGoal(e.target.value);
                  saveGoal(e.target.value);
                  triggerGoalRecalc(userProfile, e.target.value);
                }}
                placeholder="Reach 137 lbs by summer"
                className="w-full px-4 py-3 border rounded-xl resize-none"
                rows={Math.max(3, goal.split('\n').length)}
              />
              {isCalculatingGoals && (
                <div className="text-xs text-blue-600 mt-2">Updating calorie/protein targets...</div>
              )}
              {nutritionGoals && (
                <div className="mt-3 p-3 bg-blue-50 rounded-xl">
                  <div className="text-xs font-bold text-gray-600 mb-1">AI-RECOMMENDED TARGETS</div>
                  <div className="text-sm text-gray-700">
                    <span className="font-semibold text-blue-600">{nutritionGoals.calorieMin}-{nutritionGoals.calorieMax}</span> cal/day,
                    <span className="font-semibold text-green-600 ml-1">{nutritionGoals.protein}g</span> protein/day
                  </div>
                  <button
                    onClick={() => calculateNutritionGoals(userProfile, goal)}
                    disabled={isCalculatingGoals || !apiKey}
                    className="mt-2 px-3 py-1.5 bg-blue-100 text-blue-700 rounded-lg text-xs font-semibold disabled:opacity-50"
                  >
                    {isCalculatingGoals ? 'Calculating...' : 'Recalculate Targets'}
                  </button>
                </div>
              )}
            </div>

            <div className="bg-white rounded-2xl shadow-lg p-6">
              <h2 className="text-2xl font-bold mb-4">Profile</h2>
              <div className="space-y-4">
                <div className="grid grid-cols-2 gap-4">
                  <div>
                    <label className="block text-sm font-bold mb-2">STARTING WEIGHT</label>
                    <div className="relative">
                      <input
                        type="number"
                        value={userProfile.startingWeight}
                        onChange={(e) => {
                          const p = {...userProfile, startingWeight: e.target.value};
                          setUserProfile(p); saveUserProfile(p);
                          triggerGoalRecalc(p, goal);
                        }}
                        className="w-full px-4 py-3 pr-12 border rounded-xl"
                      />
                      <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm">lbs</span>
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-bold mb-2">BIRTH YEAR</label>
                    <input
                      type="number"
                      value={userProfile.birthYear}
                      onChange={(e) => {
                        const p = {...userProfile, birthYear: e.target.value};
                        setUserProfile(p); saveUserProfile(p);
                        triggerGoalRecalc(p, goal);
                      }}
                      className="w-full px-4 py-3 border rounded-xl"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-sm font-bold mb-2">HEIGHT</label>
                  <div className="grid grid-cols-2 gap-4">
                    <div className="relative">
                      <input
                        type="number"
                        value={userProfile.heightFt}
                        onChange={(e) => {
                          const p = {...userProfile, heightFt: e.target.value};
                          setUserProfile(p); saveUserProfile(p);
                          triggerGoalRecalc(p, goal);
                        }}
                        className="w-full px-4 py-3 pr-12 border rounded-xl"
                      />
                      <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm">ft</span>
                    </div>
                    <div className="relative">
                      <input
                        type="number"
                        value={userProfile.heightIn}
                        onChange={(e) => {
                          const p = {...userProfile, heightIn: e.target.value};
                          setUserProfile(p); saveUserProfile(p);
                          triggerGoalRecalc(p, goal);
                        }}
                        className="w-full px-4 py-3 pr-12 border rounded-xl"
                      />
                      <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm">in</span>
                    </div>
                  </div>
                </div>

                <div>
                  <h3 className="text-lg font-bold mb-3">Period</h3>
                  <div className="space-y-4">
                    <div className="flex items-center justify-between">
                      <span className="text-sm">Period Tracking</span>
                      <input
                        type="checkbox"
                        checked={userProfile.periodTracking}
                        onChange={(e) => {
                          const p = {...userProfile, periodTracking: e.target.checked};
                          setUserProfile(p); saveUserProfile(p);
                        }}
                        className="w-6 h-6"
                      />
                    </div>
                    {userProfile.periodTracking && (
                      <div>
                        <label className="block text-sm font-bold mb-2">AVERAGE CYCLE LENGTH</label>
                        <div className="relative">
                          <input
                            type="number"
                            value={userProfile.cycleLength}
                            onChange={(e) => {
                              const p = {...userProfile, cycleLength: e.target.value};
                              setUserProfile(p); saveUserProfile(p);
                            }}
                            className="w-full px-4 py-3 pr-16 border rounded-xl"
                            placeholder="28" min="20" max="40"
                          />
                          <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm">days</span>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>

            <div className="bg-white rounded-2xl shadow-lg p-6">
              <h2 className="text-2xl font-bold mb-4">
                <span className="flex items-center gap-2">
                  Cloud Sync
                  {driveSyncStatus === 'syncing' && <span className="text-sm font-normal text-blue-500">Syncing...</span>}
                  {driveSyncStatus === 'synced' && <span className="text-sm font-normal text-green-500">Synced</span>}
                  {driveSyncStatus === 'error' && <span className="text-sm font-normal text-red-500">Sync Error</span>}
                </span>
              </h2>
              <p className="text-sm text-gray-600 mb-4">
                Sync your data across devices using your personal Google Drive. Data is stored in a private app folder that only this app can access.
              </p>

              {!driveEnabled ? (
                <div className="space-y-3">
                  <div>
                    <label className="block text-sm font-bold mb-2">GOOGLE CLIENT ID</label>
                    <input
                      type="text"
                      value={googleClientIdInput}
                      onChange={(e) => setGoogleClientIdInput(e.target.value)}
                      placeholder="xxxxx.apps.googleusercontent.com"
                      className="w-full px-4 py-3 border rounded-xl text-sm"
                    />
                    <p className="text-xs text-gray-500 mt-2">
                      Required for Google Drive sync. Follow the setup guide to get your Client ID.
                    </p>
                  </div>
                  <button
                    onClick={() => saveGoogleClientId(googleClientIdInput)}
                    disabled={!googleClientIdInput.includes('.apps.googleusercontent.com')}
                    className="w-full px-6 py-3 bg-gradient-to-r from-blue-600 to-green-600 text-white rounded-xl font-semibold disabled:opacity-50"
                  >
                    Enable Google Drive Sync
                  </button>
                </div>
              ) : (
                <div className="space-y-3">
                  {driveSignedIn ? (
                    <div>
                      <div className="flex items-center gap-2 mb-3 p-3 bg-green-50 rounded-xl">
                        <div className="w-3 h-3 rounded-full bg-green-500"></div>
                        <span className="text-sm font-semibold text-green-700">Connected to Google Drive</span>
                      </div>
                      <button
                        onClick={async () => {
                          setDriveSyncStatus('syncing');
                          const driveData = await DriveSync.loadFromDrive();
                          if (driveData && restoreFromDriveData(driveData)) {
                            window.location.reload();
                          } else {
                            // Push local data to Drive
                            const data = gatherAllData();
                            await DriveSync.saveToDrive(data);
                            setDriveSyncStatus('synced');
                            alert('Sync complete! Data is up to date.');
                          }
                        }}
                        className="w-full px-4 py-2.5 bg-blue-100 text-blue-700 rounded-xl font-semibold text-sm mb-2"
                      >
                        Force Sync Now
                      </button>
                      <button
                        onClick={handleDriveSignOut}
                        className="w-full px-4 py-2 bg-gray-100 text-gray-600 rounded-xl font-semibold text-sm"
                      >
                        Sign Out of Google
                      </button>
                    </div>
                  ) : (
                    <button
                      onClick={handleDriveSignIn}
                      className="w-full px-6 py-3 bg-white border-2 border-gray-300 rounded-xl font-semibold flex items-center justify-center gap-3 hover:bg-gray-50"
                    >
                      <svg className="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                      </svg>
                      Sign in with Google
                    </button>
                  )}

                  <div className="border-t pt-3 mt-3">
                    <div className="flex items-center justify-between">
                      <span className="text-xs text-gray-500">Client ID configured</span>
                      <button
                        onClick={() => {
                          localStorage.removeItem('google-client-id');
                          setDriveEnabled(false);
                          setDriveSignedIn(false);
                          setGoogleClientIdInput('');
                        }}
                        className="text-xs text-red-500 font-semibold"
                      >
                        Remove
                      </button>
                    </div>
                  </div>
                </div>
              )}
            </div>

            <div className="bg-white rounded-2xl shadow-lg p-6">
              <h2 className="text-2xl font-bold mb-4">API Settings</h2>
              <div className="space-y-3">
                <div>
                  <label className="block text-sm font-bold mb-2">OPENAI API KEY</label>
                  <input
                    type="password"
                    value={apiKey}
                    onChange={(e) => {
                      setApiKey(e.target.value);
                      localStorage.setItem('openai-api-key', e.target.value);
                    }}
                    placeholder="sk-..."
                    className="w-full px-4 py-3 border rounded-xl"
                  />
                  <p className="text-xs text-gray-500 mt-2">
                    Stored locally in your browser. Never sent anywhere except OpenAI.
                  </p>
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={() => {
                      localStorage.removeItem('openai-api-key');
                      setApiKey('');
                      setShowApiKeyPrompt(true);
                    }}
                    className="flex-1 px-4 py-2 bg-red-100 text-red-700 rounded-xl font-semibold text-sm"
                  >
                    Remove Key
                  </button>
                  <a
                    href="https://platform.openai.com/api-keys"
                    target="_blank"
                    rel="noopener"
                    className="flex-1 px-4 py-2 bg-blue-100 text-blue-700 rounded-xl font-semibold text-sm text-center"
                  >
                    Get API Key
                  </a>
                </div>
              </div>
            </div>

            <div className="bg-white rounded-2xl shadow-lg p-6">
              <h2 className="text-2xl font-bold mb-4">Data Management</h2>
              <div className="space-y-3">
                <div>
                  <button
                    onClick={exportData}
                    className="w-full px-6 py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl hover:from-blue-700 hover:to-indigo-700 font-semibold shadow-lg flex items-center justify-center transition-colors mb-2"
                  >
                    <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Export All Data
                  </button>

                </div>

                <div>
                  {!showClearConfirm ? (
                    <button
                      onClick={() => setShowClearConfirm(true)}
                      className="w-full px-6 py-3.5 bg-transparent border-2 border-red-600 text-red-600 rounded-xl hover:bg-red-50 font-semibold flex items-center justify-center transition-colors"
                    >
                      Clear Data
                    </button>
                  ) : (
                    <div className="p-4 bg-red-50 border-2 border-red-200 rounded-xl">
                      <div className="text-sm text-center text-red-700 font-bold mb-3">
                        Clear all data? This cannot be undone.
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <button onClick={() => setShowClearConfirm(false)} className="px-4 py-2 bg-white border-2 border-gray-300 text-gray-700 rounded-xl font-semibold transition-colors">Cancel</button>
                        <button onClick={clearData} className="px-4 py-2 bg-red-600 text-white rounded-xl font-semibold transition-colors">Clear All</button>
                      </div>
                    </div>
                  )}
                </div>

                <div>
                  <input type="file" accept=".json" onChange={importData} id="merge-backup-input" className="hidden" />
                  <label
                    htmlFor="merge-backup-input"
                    className="w-full px-6 py-3.5 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-xl font-semibold shadow-lg flex items-center justify-center transition-colors cursor-pointer mb-2"
                  >
                    <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                    </svg>
                    Merge Backup (File)
                  </label>

                </div>

                {lastBackupDate && (
                  <p className="text-xs text-center text-gray-500 mt-3">
                    Last backup: {new Date(lastBackupDate).toLocaleDateString()} at {new Date(lastBackupDate).toLocaleTimeString()}
                  </p>
                )}
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Undo Popup */}
      {undoState && (
        <div className="fixed top-0 left-0 right-0 z-50">
          <div className="bg-gray-900 text-white py-3 px-4 flex items-center justify-between">
            <div className="font-medium text-sm">
              {undoState.type === 'food' ? undoState.item.name : undoState.item.type} deleted
            </div>
            <div className="flex items-center gap-4">
              <button onClick={undoDelete} className="text-white hover:text-gray-300 font-semibold text-sm underline">Undo</button>
              <button onClick={dismissUndo} className="text-gray-400 hover:text-white text-lg">X</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<HealthTracker />);
    </script>
</body>
</html>

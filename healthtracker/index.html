                      className="w-full px-4 py-3 border rounded-xl"
                    />
                  </div>
                </div>

                <div>
                  <label className="block text-sm font-bold mb-2">HEIGHT</label>
                  <div className="grid grid-cols-2 gap-4">
                    <div className="relative">
                      <input
                        type="number"
                        value={userProfile.heightFt}
                        onChange={(e) => {
                          const p = {...userProfile, heightFt: e.target.value};
                          setUserProfile(p); saveUserProfile(p);
                          triggerGoalRecalc(p, goal);
                        }}
                        className="w-full px-4 py-3 pr-12 border rounded-xl"
                      />
                      <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm">ft</span>
                    </div>
                    <div className="relative">
                      <input
                        type="number"
                        value={userProfile.heightIn}
                        onChange={(e) => {
                          const p = {...userProfile, heightIn: e.target.value};
                          setUserProfile(p); saveUserProfile(p);
                          triggerGoalRecalc(p, goal);
                        }}
                        className="w-full px-4 py-3 pr-12 border rounded-xl"
                      />
                      <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm">in</span>
                    </div>
                  </div>
                </div>

                <div>
                  <h3 className="text-lg font-bold mb-3">Period</h3>
                  <div className="space-y-4">
                    <div className="flex items-center justify-between">
                      <span className="text-sm">Period Tracking</span>
                      <input
                        type="checkbox"
                        checked={userProfile.periodTracking}
                        onChange={(e) => {
                          const p = {...userProfile, periodTracking: e.target.checked};
                          setUserProfile(p); saveUserProfile(p);
                        }}
                        className="w-6 h-6"
                      />
                    </div>
                    {userProfile.periodTracking && (
                      <div>
                        <label className="block text-sm font-bold mb-2">AVERAGE CYCLE LENGTH</label>
                        <div className="relative">
                          <input
                            type="number"
                            value={userProfile.cycleLength}
                            onChange={(e) => {
                              const p = {...userProfile, cycleLength: e.target.value};
                              setUserProfile(p); saveUserProfile(p);
                            }}
                            className="w-full px-4 py-3 pr-16 border rounded-xl"
                            placeholder="28" min="20" max="40"
                          />
                          <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 text-sm">days</span>
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>

            <div className="bg-white rounded-2xl shadow-lg p-6">
              <h2 className="text-2xl font-bold mb-4">API Settings</h2>
              <div className="space-y-3">
                <div>
                  <label className="block text-sm font-bold mb-2">OPENAI API KEY</label>
                  <input
                    type="password"
                    value={apiKey}
                    onChange={(e) => {
                      setApiKey(e.target.value);
                      localStorage.setItem('openai-api-key', e.target.value);
                    }}
                    placeholder="sk-..."
                    className="w-full px-4 py-3 border rounded-xl"
                  />
                  <p className="text-xs text-gray-500 mt-2">
                    Stored locally in your browser. Never sent anywhere except OpenAI.
                  </p>
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={() => {
                      localStorage.removeItem('openai-api-key');
                      setApiKey('');
                      setShowApiKeyPrompt(true);
                    }}
                    className="flex-1 px-4 py-2 bg-red-100 text-red-700 rounded-xl font-semibold text-sm"
                  >
                    Remove Key
                  </button>
                  <a
                    href="https://platform.openai.com/api-keys"
                    target="_blank"
                    rel="noopener"
                    className="flex-1 px-4 py-2 bg-blue-100 text-blue-700 rounded-xl font-semibold text-sm text-center"
                  >
                    Get API Key
                  </a>
                </div>
              </div>
            </div>

            <div className="bg-white rounded-2xl shadow-lg p-6">
              <h2 className="text-2xl font-bold mb-4">Data Management</h2>
              <div className="space-y-3">
                <div>
                  <button
                    onClick={exportData}
                    className="w-full px-6 py-3.5 bg-gradient-to-r from-blue-600 to-indigo-600 text-white rounded-xl hover:from-blue-700 hover:to-indigo-700 font-semibold shadow-lg flex items-center justify-center transition-colors mb-2"
                  >
                    <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                    </svg>
                    Export All Data
                  </button>

                  {!showExportJson ? (
                    <div className="space-y-2">
                      <button
                        onClick={() => {
                          const endDate = new Date();
                          const startDate = new Date();
                          startDate.setMonth(startDate.getMonth() - 3);
                          const allKeys = Object.keys(localStorage);
                          const dailyLogs = [];
                          for (const key of allKeys) {
                            if (key.startsWith('nutrition-') && key !== 'nutrition-goals') {
                              const data = JSON.parse(localStorage.getItem(key));
                              const logDate = new Date(data.date);
                              if (logDate >= startDate && logDate <= endDate) dailyLogs.push(data);
                            }
                          }
                          const expData = {
                            version: '1.0', exportDate: new Date().toISOString(), dateRange: 'Last 3 months',
                            dailyLogs: dailyLogs.sort((a, b) => a.date.localeCompare(b.date)),
                            goal: goal, profile: userProfile, nutritionGoals: nutritionGoals
                          };
                          setExportedJson(JSON.stringify(expData, null, 2));
                          setShowExportJson(true);
                        }}
                        className="w-full px-4 py-2 bg-blue-100 text-blue-700 rounded-xl hover:bg-blue-200 font-semibold text-sm"
                      >
                        Last 3 Months (Copy)
                      </button>
                      <button
                        onClick={() => {
                          const currentYear = new Date().getFullYear();
                          const allKeys = Object.keys(localStorage);
                          const dailyLogs = [];
                          for (const key of allKeys) {
                            if (key.startsWith('nutrition-') && key !== 'nutrition-goals') {
                              const data = JSON.parse(localStorage.getItem(key));
                              if (new Date(data.date).getFullYear() === currentYear) dailyLogs.push(data);
                            }
                          }
                          const expData = {
                            version: '1.0', exportDate: new Date().toISOString(), dateRange: `Year ${currentYear}`,
                            dailyLogs: dailyLogs.sort((a, b) => a.date.localeCompare(b.date)),
                            goal: goal, profile: userProfile, nutritionGoals: nutritionGoals
                          };
                          setExportedJson(JSON.stringify(expData, null, 2));
                          setShowExportJson(true);
                        }}
                        className="w-full px-4 py-2 bg-blue-100 text-blue-700 rounded-xl hover:bg-blue-200 font-semibold text-sm"
                      >
                        This Year (Copy)
                      </button>
                    </div>
                  ) : (
                    <div className="space-y-2">
                      <div className="text-sm font-semibold text-gray-700">Tap text to select all, then copy:</div>
                      <textarea
                        value={exportedJson}
                        readOnly
                        className="w-full px-3 py-2 border rounded-xl text-xs font-mono resize-none"
                        rows={8}
                        onClick={(e) => e.target.select()}
                      />
                      <div className="text-xs text-gray-600 text-center">{exportedJson.length.toLocaleString()} characters</div>
                      <button
                        onClick={() => { setShowExportJson(false); setExportedJson(''); }}
                        className="w-full px-3 py-2 bg-gray-200 text-gray-700 rounded-xl font-semibold text-sm"
                      >Close</button>
                    </div>
                  )}
                </div>

                <div>
                  {!showClearConfirm ? (
                    <button
                      onClick={() => setShowClearConfirm(true)}
                      className="w-full px-6 py-3.5 bg-transparent border-2 border-red-600 text-red-600 rounded-xl hover:bg-red-50 font-semibold flex items-center justify-center transition-colors"
                    >
                      Clear Data
                    </button>
                  ) : (
                    <div className="p-4 bg-red-50 border-2 border-red-200 rounded-xl">
                      <div className="text-sm text-center text-red-700 font-bold mb-3">
                        Clear all data? This cannot be undone.
                      </div>
                      <div className="grid grid-cols-2 gap-2">
                        <button onClick={() => setShowClearConfirm(false)} className="px-4 py-2 bg-white border-2 border-gray-300 text-gray-700 rounded-xl font-semibold transition-colors">Cancel</button>
                        <button onClick={clearData} className="px-4 py-2 bg-red-600 text-white rounded-xl font-semibold transition-colors">Clear All</button>
                      </div>
                    </div>
                  )}
                </div>

                <div>
                  <input type="file" accept=".json" onChange={importData} id="merge-backup-input" className="hidden" />
                  <label
                    htmlFor="merge-backup-input"
                    className="w-full px-6 py-3.5 bg-gradient-to-r from-purple-600 to-pink-600 text-white rounded-xl font-semibold shadow-lg flex items-center justify-center transition-colors cursor-pointer mb-2"
                  >
                    <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                    </svg>
                    Merge Backup (File)
                  </label>

                  {!showPasteJson ? (
                    <button
                      onClick={() => setShowPasteJson(true)}
                      className="w-full px-4 py-2 bg-purple-100 text-purple-700 rounded-xl hover:bg-purple-200 font-semibold text-sm"
                    >
                      Or Paste JSON Instead
                    </button>
                  ) : (
                    <div className="space-y-2">
                      <textarea
                        value={pastedJson}
                        onChange={(e) => setPastedJson(e.target.value)}
                        placeholder='Paste exported JSON here...'
                        className="w-full px-3 py-2 border rounded-xl text-xs font-mono resize-none"
                        rows={4}
                      />
                      <div className="flex gap-2">
                        <button onClick={() => { setShowPasteJson(false); setPastedJson(''); }} className="flex-1 px-3 py-2 bg-gray-200 text-gray-700 rounded-xl font-semibold text-sm">Cancel</button>
                        <button
                          onClick={async () => {
                            try {
                              const imported = JSON.parse(pastedJson);
                              let addedLogs = 0; let skippedLogs = 0;
                              for (const log of imported.dailyLogs || []) {
                                const existing = localStorage.getItem(`nutrition-${log.date}`);
                                if (!existing) { localStorage.setItem(`nutrition-${log.date}`, JSON.stringify(log)); addedLogs++; }
                                else { skippedLogs++; }
                              }
                              if (imported.goal) { localStorage.setItem('health-goal', imported.goal); setGoal(imported.goal); }
                              if (imported.profile) { localStorage.setItem('user-profile', JSON.stringify(imported.profile)); setUserProfile(imported.profile); }
                              if (imported.nutritionGoals) { localStorage.setItem('nutrition-goals', JSON.stringify(imported.nutritionGoals)); setNutritionGoals(imported.nutritionGoals); }
                              await loadDayData(currentDate);
                              setShowPasteJson(false); setPastedJson('');
                              alert(`Import complete!\n\n${addedLogs} days added, ${skippedLogs} days skipped`);
                            } catch (error) { alert('Invalid JSON: ' + error.message); }
                          }}
                          className="flex-1 px-3 py-2 bg-purple-600 text-white rounded-xl font-semibold text-sm"
                        >Import</button>
                      </div>
                    </div>
                  )}
                </div>

                {lastBackupDate && (
                  <p className="text-xs text-center text-gray-500 mt-3">
                    Last backup: {new Date(lastBackupDate).toLocaleDateString()} at {new Date(lastBackupDate).toLocaleTimeString()}
                  </p>
                )}
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Undo Popup */}
      {undoState && (
        <div className="fixed top-0 left-0 right-0 z-50">
          <div className="bg-gray-900 text-white py-3 px-4 flex items-center justify-between">
            <div className="font-medium text-sm">
              {undoState.type === 'food' ? undoState.item.name : undoState.item.type} deleted
            </div>
            <div className="flex items-center gap-4">
              <button onClick={undoDelete} className="text-white hover:text-gray-300 font-semibold text-sm underline">Undo</button>
              <button onClick={dismissUndo} className="text-gray-400 hover:text-white text-lg">X</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<HealthTracker />);
    </script>
</body>
</html>

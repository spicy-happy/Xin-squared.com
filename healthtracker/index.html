<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Health Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
    <style>
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      /* Hide spinner on number inputs */
      input[type=number]::-webkit-inner-spin-button,
      input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
      input[type=number] { -moz-appearance: textfield; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Load the encryption + sync + auth modules as ES modules and expose
         them on window.HT for the Babel-transpiled React app below. The
         localStorage interceptors install synchronously so the first React
         render sees a stable view of localStorage. -->
    <script type="module">
      import { installLocalStorageHooks, startBridge, stopBridge, tick, uploadInitialSnapshot } from "./lib/bridge.js";
      import { register, authenticate, signOut, getUserId } from "./lib/auth.js";
      import { signOutThisDevice, deleteCloudData, wipeEverything } from "./lib/wipe.js";
      import { getBackendUrl, setBackendUrl } from "./lib/config.js";
      import { getSession } from "./lib/api.js";

      installLocalStorageHooks();

      // Resume a cloud session if one was previously established on this device.
      // Note: a valid session token doesn't imply the DEK is unlocked — the
      // app still asks for the passphrase via the onboarding modal on each
      // load (re-derives KEK → unwraps DEK). Skipping that would require
      // storing the DEK at rest, which we deliberately don't do.

      window.HT = {
        register,
        authenticate,
        signOut,
        getUserId,
        signOutThisDevice,
        deleteCloudData,
        wipeEverything,
        getBackendUrl,
        setBackendUrl,
        getSession,
        startBridge,
        stopBridge,
        tick,
        uploadInitialSnapshot,
        ready: true,
      };
      window.dispatchEvent(new Event("ht-ready"));
    </script>

    <script type="text/babel">
const { useState, useEffect, useRef } = React;

// Weight chart component (pure SVG, no dependencies)
function WeightChart({ data, height = 200, unit = 'lbs', targetWeight = null, startingWeight = null, lastKnownWeight = null }) {
  // data = [{ label: "Mon", weight: 145.2 }, ...]
  const points = data.filter(d => d.weight);

  // If no data points in range, show flat line at lastKnownWeight if available
  if (points.length === 0 && !lastKnownWeight) return null;

  // Determine the effective weight for calculations
  const weights = points.length > 0 ? points.map(p => p.weight) : [lastKnownWeight];
  // Include target/starting weight in min/max calculation so lines are always visible
  const allValues = [...weights, ...(targetWeight ? [targetWeight] : []), ...(startingWeight ? [startingWeight] : [])];
  const minW = Math.min(...allValues);
  const maxW = Math.max(...allValues);
  const range = maxW - minW || 1;
  const padding = range * 0.15;
  const yMin = minW - padding;
  const yMax = maxW + padding;
  const yRange = yMax - yMin;

  const chartW = 100; // viewBox percentage width
  const chartH = height;
  const padLeft = 55;
  const padRight = 40;
  const padTop = 15;
  const padBot = 35;
  const innerW = chartW * 3 - padLeft - padRight; // scale for wider viewBox
  const innerH = chartH - padTop - padBot;
  const vbWidth = chartW * 3;

  // Map data points (use original index in full data array for x positioning)
  const allIndices = data.map((d, i) => ({ ...d, idx: i })).filter(d => d.weight);
  const totalSlots = data.length - 1 || 1;

  const chartPoints = allIndices.map(d => ({
    x: padLeft + (d.idx / totalSlots) * innerW,
    y: padTop + (1 - (d.weight - yMin) / yRange) * innerH,
    weight: d.weight,
    label: d.label
  }));

  // Build extended path: extend line from first point to left edge, last point to right edge
  const leftEdgeX = padLeft;
  const rightEdgeX = padLeft + innerW;

  let pathD;
  if (chartPoints.length === 0) {
    // No points in range, draw flat line at lastKnownWeight
    const flatY = padTop + (1 - (lastKnownWeight - yMin) / yRange) * innerH;
    pathD = `M${leftEdgeX},${flatY} L${rightEdgeX},${flatY}`;
  } else {
    // Extend left from first point, connect all points, extend right from last point
    const firstPt = chartPoints[0];
    const lastPt = chartPoints[chartPoints.length - 1];
    const segments = [];
    // Extend left (flat from first point)
    if (firstPt.x > leftEdgeX) {
      segments.push(`M${leftEdgeX},${firstPt.y}`);
      segments.push(`L${firstPt.x},${firstPt.y}`);
    } else {
      segments.push(`M${firstPt.x},${firstPt.y}`);
    }
    // Connect all data points
    for (let i = 1; i < chartPoints.length; i++) {
      segments.push(`L${chartPoints[i].x},${chartPoints[i].y}`);
    }
    // Extend right (flat from last point)
    if (lastPt.x < rightEdgeX) {
      segments.push(`L${rightEdgeX},${lastPt.y}`);
    }
    pathD = segments.join(' ');
  }

  // Y-axis labels (3 labels: min, mid, max)
  const mid = (minW + maxW) / 2;
  const yLabels = [maxW, mid, minW].map(w => ({
    y: padTop + (1 - (w - yMin) / yRange) * innerH,
    label: w.toFixed(1)
  }));

  return (
    <div className="bg-gray-50 rounded-xl p-4 mb-4">
      <div className="text-xs font-bold text-gray-600 mb-2">WEIGHT TREND</div>
      <svg viewBox={`0 0 ${vbWidth} ${chartH}`} className="w-full" style={{height: `${height}px`}}>
        {/* Grid lines */}
        {yLabels.map((yl, i) => (
          <g key={i}>
            <line x1={padLeft} y1={yl.y} x2={vbWidth - padRight} y2={yl.y} stroke="#e5e7eb" strokeWidth="0.5" />
            <text x={padLeft - 6} y={yl.y + 5} textAnchor="end" fontSize="16" fill="#6b7280">{yl.label}</text>
          </g>
        ))}
        {/* Target weight line */}
        {targetWeight && (() => {
          const ty = padTop + (1 - (targetWeight - yMin) / yRange) * innerH;
          return (
            <g>
              <line x1={padLeft} y1={ty} x2={vbWidth - padRight} y2={ty} stroke="#f59e0b" strokeWidth="1.5" strokeDasharray="6,3" />
              <text x={vbWidth - padRight + 4} y={ty + 5} fontSize="14" fill="#f59e0b" fontWeight="bold">Goal</text>
            </g>
          );
        })()}
        {/* Starting weight line */}
        {startingWeight && (() => {
          const sy = padTop + (1 - (startingWeight - yMin) / yRange) * innerH;
          return (
            <g>
              <line x1={padLeft} y1={sy} x2={vbWidth - padRight} y2={sy} stroke="#9ca3af" strokeWidth="1.5" strokeDasharray="4,4" />
              <text x={vbWidth - padRight + 4} y={sy + 5} fontSize="14" fill="#9ca3af" fontWeight="bold">Start</text>
            </g>
          );
        })()}
        {/* Line */}
        <path d={pathD} fill="none" stroke="#6366f1" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
        {/* Dots and x-axis labels */}
        {(() => {
          // Show every Nth label to avoid overlap
          const totalPts = data.length;
          const labelEvery = totalPts > 20 ? 5 : totalPts > 10 ? 2 : 1;
          // Build all x positions for labels (including non-weight days)
          const allXLabels = data.map((d, i) => ({
            x: padLeft + (i / totalSlots) * innerW,
            label: d.label,
            idx: i
          }));
          return (
            <>
              {chartPoints.map((p, i) => (
                <circle key={`dot-${i}`} cx={p.x} cy={p.y} r="4.5" fill="#6366f1" stroke="white" strokeWidth="2" />
              ))}
              {allXLabels.filter((_, i) => i % labelEvery === 0 || i === totalPts - 1).map((l, i) => (
                <text key={`lbl-${i}`} x={l.x} y={chartH - 4} textAnchor="middle" fontSize="13" fill="#6b7280">{l.label}</text>
              ))}
            </>
          );
        })()}
      </svg>
    </div>
  );
}

// Simple localStorage wrapper
const storage = {
  async get(key) {
    try {
      const value = localStorage.getItem(key);
      return value ? { key, value } : null;
    } catch (e) {
      console.error('localStorage.get error:', e);
      return null;
    }
  },
  async set(key, value) {
    try {
      localStorage.setItem(key, value);
      // Dispatch event so Drive sync can pick it up
      window.dispatchEvent(new Event('health-data-changed'));
      return { key, value };
    } catch (e) {
      console.error('localStorage.set error:', e);
      throw e;
    }
  },
  async delete(key) {
    try {
      localStorage.removeItem(key);
      return { key, deleted: true };
    } catch (e) {
      console.error('localStorage.delete error:', e);
      throw e;
    }
  }
};

// Migration: fix localStorage entries saved under wrong date keys
// due to the old toISOString().split('T')[0] bug (UTC instead of local time).
// Data logged in the evening in western timezones was saved one day ahead.
// Runs on every load to catch entries re-introduced by Drive sync or imports.
(function migrateDateKeys() {
  try {
    const toLocal = (d) => {
      const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
      return `${y}-${m}-${day}`;
    };
    const daysBetween = (a, b) => {
      return Math.round((new Date(a) - new Date(b)) / (1000 * 60 * 60 * 24));
    };
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith('nutrition-') && k !== 'nutrition-goals') keys.push(k);
    }
    for (const key of keys) {
      const raw = localStorage.getItem(key);
      if (!raw) continue;
      try {
        const data = JSON.parse(raw);
        if (!data.lastModified || !data.date) continue;
        const modifiedLocal = toLocal(new Date(data.lastModified));
        // Only fix exactly 1-day shifts (the UTC timezone bug).
        // Larger gaps are NOT timezone issues — leave them alone.
        if (data.date > modifiedLocal && daysBetween(data.date, modifiedLocal) === 1) {
          const correctKey = `nutrition-${modifiedLocal}`;
          data.date = modifiedLocal;
          // Only move if the correct key is empty or has older data
          const existing = localStorage.getItem(correctKey);
          if (!existing) {
            localStorage.setItem(correctKey, JSON.stringify(data));
          } else {
            try {
              const ex = JSON.parse(existing);
              if (ex.lastModified && data.lastModified > ex.lastModified) {
                localStorage.setItem(correctKey, JSON.stringify(data));
              }
            } catch(e) {}
          }
          localStorage.removeItem(key);
        }
      } catch(e) {}
    }
  } catch(e) {}
})();

// OpenAI API helper - supports text-only or text+images
async function callOpenAI(apiKey, prompt, imageBase64Array = []) {
  if (!apiKey) throw new Error('No API key');

  let content;
  if (imageBase64Array.length > 0) {
    // Vision request: array of text + image content parts
    content = [{ type: "text", text: prompt }];
    for (const img of imageBase64Array) {
      content.push({
        type: "image_url",
        image_url: { url: img, detail: "low" }
      });
    }
  } else {
    content = prompt;
  }

  const response = await fetch("https://api.openai.com/v1/chat/completions", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${apiKey}`
    },
    body: JSON.stringify({
      model: "gpt-4o-mini",
      messages: [{ role: "user", content }]
    })
  });
  const data = await response.json();
  if (data.error) {
    throw new Error(data.error.message || 'API error');
  }
  return data.choices[0]?.message?.content || "";
}

// Convert File to base64 data URL
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Cloud sync (encrypted) is provided by ./lib/bridge.js which wraps
// localStorage.setItem and ticks pull/push against the worker when the user
// has signed in. Until the user opts into cloud mode, the app behaves
// identically to the local-only version below.

function HealthTracker() {
  const [logPlaceholder] = useState(() => {
    const examples = [
      "2 scrambled eggs with toast, 30 min jog",
      "grilled chicken salad, 1 hour weight training",
      "overnight oats with berries, 20 min yoga",
      "salmon with roasted vegetables, weigh 152 lbs",
      "protein shake with banana, 45 min cycling",
      "avocado toast with poached egg, walked 2 miles",
      "chicken stir fry with brown rice, teaching judo",
      "greek yogurt with honey, 30 min swimming",
      "tuna poke bowl, 1 hour basketball, period started",
      "acai bowl with granola, 15 min stretching",
      "turkey wrap and an apple, intense HIIT session",
      "oatmeal with blueberries, 40 min elliptical",
      "grilled shrimp tacos, played tennis for an hour",
      "quinoa bowl with black beans, 30 min cleaning",
      "cottage cheese with pineapple, evening walk"
    ];
    return examples[Math.floor(Math.random() * examples.length)];
  });

  const toLocalDateStr = (date) => {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  };

  const [activeTab, setActiveTab] = useState('log');
  const [summaryView, setSummaryView] = useState('day');
  const [currentDate, setCurrentDate] = useState(toLocalDateStr(new Date()));
  const [weekOffset, setWeekOffset] = useState(0);
  const [monthOffset, setMonthOffset] = useState(0);
  const [weight, setWeight] = useState('');
  const [isTrainingDay, setIsTrainingDay] = useState(false);
  const [isPeriod, setIsPeriod] = useState(false);
  const [weightSaving, setWeightSaving] = useState('');
  const [editingWeight, setEditingWeight] = useState(false);
  const [editingWeightValue, setEditingWeightValue] = useState('');
  const weightSaveTimeoutRef = useRef(null);
  const fileInputRef = useRef(null);

  const [unitSystem, setUnitSystem] = useState(() => localStorage.getItem('unit-system') || 'standard');
  const isMetric = unitSystem === 'metric';

  // Weight: stored internally as lbs, displayed as lbs or kg
  const displayWeight = (w) => {
    if (!w) return '';
    const num = parseFloat(w);
    if (isNaN(num)) return '';
    return isMetric ? (num * 0.453592).toFixed(1) : num.toFixed(1);
  };
  const weightLabel = isMetric ? 'kg' : 'lbs';

  // Height: stored internally as ft/in, displayed as ft/in or cm
  const displayHeight = (ft, inches) => {
    if (!ft && !inches) return '';
    const totalInches = (parseFloat(ft) || 0) * 12 + (parseFloat(inches) || 0);
    if (isMetric) {
      const cm = totalInches * 2.54;
      return cm.toFixed(0);
    }
    return null; // use ft/in fields directly
  };
  const heightLabel = isMetric ? 'cm' : 'ft / in';

  const switchUnitSystem = (system) => {
    setUnitSystem(system);
    localStorage.setItem('unit-system', system);
  };

  const [userProfile, setUserProfile] = useState({
    startingWeight: '',
    targetWeight: '',
    gender: 'female',
    periodTracking: true,
    cycleLength: '28',
    heightFt: '',
    heightIn: '',
    birthYear: ''
  });

  const [logDescription, setLogDescription] = useState('');
  const [logImages, setLogImages] = useState([]); // array of { file, preview, base64 }
  const [isAnalyzingLog, setIsAnalyzingLog] = useState(false);
  const [dayReview, setDayReview] = useState(null);
  const [isReviewingDay, setIsReviewingDay] = useState(false);
  const [foods, setFoods] = useState([]);
  const [exercises, setExercises] = useState([]);
  const [editingFoodId, setEditingFoodId] = useState(null);
  const [editingFoodText, setEditingFoodText] = useState('');
  const [editingExerciseId, setEditingExerciseId] = useState(null);
  const [editingExerciseText, setEditingExerciseText] = useState('');
  const [showCalendar, setShowCalendar] = useState(false);
  const [calendarMonth, setCalendarMonth] = useState(new Date().getMonth());
  const [calendarYear, setCalendarYear] = useState(new Date().getFullYear());
  const [undoState, setUndoState] = useState(null);
  const undoTimeoutRef = useRef(null);
  const [showClearConfirm, setShowClearConfirm] = useState(false);
  const [showPasteJson, setShowPasteJson] = useState(false);
  const [pastedJson, setPastedJson] = useState('');
  const [showExportJson, setShowExportJson] = useState(false);
  const [exportedJson, setExportedJson] = useState('');
  const [goal, setGoal] = useState('');
  const [showBackupReminder, setShowBackupReminder] = useState(false);
  const [lastBackupDate, setLastBackupDate] = useState('');
  const [backupReminderDismissed, setBackupReminderDismissed] = useState('');

  // API key state
  const [apiKey, setApiKey] = useState('');
  const [showApiKeyPrompt, setShowApiKeyPrompt] = useState(false);

  // AI-powered nutrition goals
  const [nutritionGoals, setNutritionGoals] = useState({ calorieMin: 1800, calorieMax: 1800, protein: 150 });
  const [isCalculatingGoals, setIsCalculatingGoals] = useState(false);
  const goalCalcTimeoutRef = useRef(null);

  // Cloud sync UI state. The actual sync engine lives in ./lib/bridge.js.
  // `syncStatus` mirrors what the bridge reports so the header chip shows
  // "Syncing…" / "Synced" / "Sync error".
  const [cloudMode, setCloudMode] = useState(() => localStorage.getItem('ht-mode') || 'unset'); // 'unset' | 'local' | 'cloud'
  const [syncStatus, setSyncStatus] = useState(''); // '', 'syncing', 'synced', 'error'
  const [showOnboarding, setShowOnboarding] = useState(() => !localStorage.getItem('ht-mode'));
  const [showSettings, setShowSettings] = useState(false);

  // Load API key on mount
  useEffect(() => {
    const savedKey = localStorage.getItem('openai-api-key');
    if (savedKey) {
      setApiKey(savedKey);
    } else {
      setShowApiKeyPrompt(true);
    }
    // Load saved nutrition goals
    const savedGoals = localStorage.getItem('nutrition-goals');
    if (savedGoals) {
      try {
        setNutritionGoals(JSON.parse(savedGoals));
      } catch (e) {}
    }
  }, []);

  // Subscribe to bridge status events. The bridge module emits
  // 'ht-sync-status' on every push/pull tick with detail = 'syncing' |
  // 'synced' | 'error'. When the user is in local-only mode the bridge is
  // dormant and never emits — UI stays blank.
  useEffect(() => {
    const handler = (e) => setSyncStatus(e?.detail ?? '');
    window.addEventListener('ht-sync-status', handler);
    return () => window.removeEventListener('ht-sync-status', handler);
  }, []);

  useEffect(() => {
    if (weightSaveTimeoutRef.current) {
      clearTimeout(weightSaveTimeoutRef.current);
    }
    setWeightSaving('');
    if (undoTimeoutRef.current) {
      clearTimeout(undoTimeoutRef.current);
    }
    setUndoState(null);
    setEditingFoodId(null);
    setEditingFoodText('');
    setEditingExerciseId(null);
    setEditingExerciseText('');
    setShowCalendar(false);
    setWeight('');
    setIsPeriod(false);
    setFoods([]);
    setExercises([]);
    loadDayData(currentDate);
    loadGoal();
    loadUserProfile();
    checkBackupReminder();
  }, [currentDate]);

  const checkBackupReminder = async () => {
    const backupResult = await storage.get('last-backup-date');
    const dismissResult = await storage.get('backup-reminder-dismissed');
    if (backupResult?.value) setLastBackupDate(backupResult.value);
    if (dismissResult?.value) setBackupReminderDismissed(dismissResult.value);
    const now = Date.now();
    let shouldShow = false;
    if (!backupResult?.value) {
      if (!dismissResult?.value) {
        shouldShow = true;
      } else {
        const dismissDate = new Date(dismissResult.value);
        const daysSinceDismiss = (now - dismissDate.getTime()) / (1000 * 60 * 60 * 24);
        if (daysSinceDismiss > 30) shouldShow = true;
      }
    } else {
      const lastBackup = new Date(backupResult.value);
      const daysSinceBackup = (now - lastBackup.getTime()) / (1000 * 60 * 60 * 24);
      if (daysSinceBackup > 30) {
        if (!dismissResult?.value) {
          shouldShow = true;
        } else {
          const dismissDate = new Date(dismissResult.value);
          const daysSinceDismiss = (now - dismissDate.getTime()) / (1000 * 60 * 60 * 24);
          if (daysSinceDismiss > 30) shouldShow = true;
        }
      }
    }
    setShowBackupReminder(shouldShow);
  };

  const loadDayData = async (date) => {
    try {
      const result = await storage.get(`nutrition-${date}`);
      if (result?.value) {
        try {
          const data = JSON.parse(result.value);
          if (data.date === date) {
            setWeight(data.weight || '');
            setIsPeriod(data.isPeriod || false);
            setFoods(data.foods || []);
            setExercises(data.exercises || []);
          } else {
            setWeight(''); setIsPeriod(false); setFoods([]); setExercises([]);
          }
        } catch (error) {
          setWeight(''); setIsPeriod(false); setFoods([]); setExercises([]);
        }
      } else {
        setWeight(''); setIsPeriod(false); setFoods([]); setExercises([]);
      }
    } catch (error) {
      setWeight(''); setIsPeriod(false); setFoods([]); setExercises([]);
    }
  };

  // Read-modify-write helper: reads latest data from storage, merges updates, and saves.
  // This prevents race conditions where concurrent saves overwrite each other's fields.
  const updateDayStorage = async (date, updates) => {
    const result = await storage.get(`nutrition-${date}`);
    const data = result?.value ? JSON.parse(result.value) : { date };
    Object.assign(data, updates, { lastModified: new Date().toISOString() });
    await storage.set(`nutrition-${date}`, JSON.stringify(data));
  };

  const loadGoal = async () => {
    try {
      const result = await storage.get('health-goal');
      if (result?.value) setGoal(result.value);
    } catch (error) {}
  };

  const saveGoal = async (text) => {
    await storage.set('health-goal', text);
  };

  const loadUserProfile = async () => {
    try {

    const monthData = [];
    for (let day = 1; day <= daysInMonth; day++) {
      const date = new Date(year, month, day);
      const dateStr = toLocalDateStr(date);
      if (dateStr === currentDate) {
        monthData.push({ date: dateStr, weight, isPeriod, foods, exercises });
      } else {
        const stored = localStorage.getItem(`nutrition-${dateStr}`);
        if (stored) {
          monthData.push(JSON.parse(stored));
        } else {
          monthData.push({ date: dateStr, weight: '', foods: [], exercises: [] });
        }
      }
    }
    return monthData;
  };

  // Find the most recent weight before a given date by searching backwards
  const getLastKnownWeight = (beforeDateStr) => {
    const date = new Date(beforeDateStr + 'T00:00:00');
    // Start from the day before and search up to 365 days back
    for (let i = 1; i <= 365; i++) {
      const checkDate = new Date(date);
      checkDate.setDate(date.getDate() - i);
      const dateStr = toLocalDateStr(checkDate);
      if (dateStr === currentDate && weight) {
        return parseFloat(weight);
      }
      const stored = localStorage.getItem(`nutrition-${dateStr}`);
      if (stored) {
        const parsed = JSON.parse(stored);
        if (parsed.weight) return parseFloat(parsed.weight);
      }
    }
    return null;
  };

  const navigateDay = (direction) => {
    const [y, m, d] = currentDate.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    date.setDate(date.getDate() + direction);
    setCurrentDate(toLocalDateStr(date));
    setDayReview(null);
  };

  const formatDate = (dateStr, includeWeekday = false) => {
    const [year, month, day] = dateStr.split('-').map(Number);
    const date = new Date(year, month - 1, day);
    if (includeWeekday) {
      return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
    }
    return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  };

  const formatDateWithWeekday = (dateStr) => {
    const [year, month, day] = dateStr.split('-').map(Number);
    const date = new Date(year, month - 1, day);
    return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  };

  const canNavigateForward = () => {
    const today = toLocalDateStr(new Date());
    return currentDate < today;
  };

  const getLastWeight = () => {
    const [y, m, d] = currentDate.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    for (let i = 1; i <= 30; i++) {
      date.setDate(date.getDate() - 1);
      const dateStr = toLocalDateStr(date);
      const stored = localStorage.getItem(`nutrition-${dateStr}`);
      if (stored) {
        const data = JSON.parse(stored);
        if (data.weight) return data.weight;
      }
    }
    return '';
  };

  const getCalendarDays = () => {
    const firstDay = new Date(calendarYear, calendarMonth, 1);
    const lastDay = new Date(calendarYear, calendarMonth + 1, 0);
    const daysInMonth = lastDay.getDate();
    const startDayOfWeek = firstDay.getDay();
    const adjustedStart = startDayOfWeek === 0 ? 6 : startDayOfWeek - 1;
    const days = [];
    for (let i = 0; i < adjustedStart; i++) days.push(null);
    for (let day = 1; day <= daysInMonth; day++) {
      const dateStr = `${calendarYear}-${String(calendarMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      days.push(dateStr);
    }
    return days;
  };

  const selectDate = (dateStr) => {
    setCurrentDate(dateStr);
    setShowCalendar(false);
  };

  const navigateCalendarMonth = (direction) => {
    const newDate = new Date(calendarYear, calendarMonth + direction, 1);
    setCalendarMonth(newDate.getMonth());
    setCalendarYear(newDate.getFullYear());
  };

  const openCalendar = () => {
    setCalendarMonth(new Date().getMonth());
    setCalendarYear(new Date().getFullYear());
    setShowCalendar(true);
  };

  const getPredictedPeriods = (targetMonth, targetYear) => {
    if (!userProfile.periodTracking || !userProfile.cycleLength) return [];
    let lastPeriodDate = null;
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (key.startsWith('nutrition-') && key !== 'nutrition-goals') {
        const value = localStorage.getItem(key);
        if (value) {
          const data = JSON.parse(value);
          if (data.isPeriod) {
            const [py, pm, pd] = data.date.split('-').map(Number);
            const date = new Date(py, pm - 1, pd);
            if (!lastPeriodDate || date > lastPeriodDate) lastPeriodDate = date;
          }
        }
      }
    }
    if (!lastPeriodDate) return [];
    const cycleLength = parseInt(userProfile.cycleLength);
    const predicted = [];
    const monthStart = new Date(targetYear, targetMonth, 1);
    const monthEnd = new Date(targetYear, targetMonth + 1, 0);
    let nextPeriod = new Date(lastPeriodDate);
    while (nextPeriod < monthStart) {
      nextPeriod.setDate(nextPeriod.getDate() + cycleLength);
    }
    while (nextPeriod <= monthEnd) {
      predicted.push(toLocalDateStr(nextPeriod));
      nextPeriod.setDate(nextPeriod.getDate() + cycleLength);
    }
    return predicted;
  };

  // ====================================================================
  // Cloud sync onboarding + settings modals (rendered below).
  // The flow:
  //   - cloudMode === 'unset'  → onboarding modal shows automatically
  //   - cloudMode === 'local'  → bridge stays dormant; settings still works
  //   - cloudMode === 'cloud'  → bridge is engaged after register / authenticate
  // ====================================================================
  const [onboardStep, setOnboardStep] = useState('choose');  // 'choose' | 'cloudNew' | 'cloudExisting' | 'busy' | 'unlock'
  const [onboardPass, setOnboardPass] = useState('');
  const [onboardErr, setOnboardErr] = useState('');
  const [backendUrlInput, setBackendUrlInput] = useState('');

  // Wait for ./lib/bridge.js + auth.js to attach window.HT before allowing
  // any cloud action. The script is `type=module` so it runs deferred — on
  // very fast first paints we may render the modal before it lands.
  const [htReady, setHtReady] = useState(() => !!window.HT);
  useEffect(() => {
    if (window.HT) { setHtReady(true); return; }
    const handler = () => setHtReady(true);
    window.addEventListener('ht-ready', handler);
    return () => window.removeEventListener('ht-ready', handler);
  }, []);

  // If the user picked 'cloud' on a prior visit but the DEK isn't in memory
  // (new tab, fresh load), surface the unlock screen instead of letting them
  // think they're signed in but with no decryption capability.
  useEffect(() => {
    if (!htReady) return;
    if (cloudMode === 'cloud' && !window.HT.getUserId() && window.HT.getSession()) {
      setShowOnboarding(true);
      setOnboardStep('unlock');
    }
  }, [htReady, cloudMode]);

  const chooseLocalOnly = () => {
    localStorage.setItem('ht-mode', 'local');
    setCloudMode('local');
    setShowOnboarding(false);
  };

  const beginCloudNew = () => { setOnboardErr(''); setOnboardPass(''); setOnboardStep('cloudNew'); };
  const beginCloudExisting = () => { setOnboardErr(''); setOnboardPass(''); setOnboardStep('cloudExisting'); };

  const submitCloudNew = async () => {
    if (onboardPass.length < 8) { setOnboardErr('Passphrase must be at least 8 characters.'); return; }
    setOnboardErr(''); setOnboardStep('busy');
    try {
      await window.HT.register(onboardPass);
      localStorage.setItem('ht-mode', 'cloud');
      setCloudMode('cloud');
      // Upload everything the user had locally so far as the initial snapshot.
      try { await window.HT.uploadInitialSnapshot(); } catch (e) { console.warn('initial snapshot failed:', e?.message); }
      window.HT.startBridge();
      setShowOnboarding(false);
      setOnboardPass('');
    } catch (e) {
      setOnboardStep('cloudNew');
      setOnboardErr(e?.message === 'passkey_creation_cancelled'
        ? 'Face ID / Touch ID was cancelled. Try again to create your passkey.'
        : `Sign-up failed: ${e?.message ?? 'unknown error'}`);
    }
  };

  const submitCloudExisting = async () => {
    if (onboardPass.length === 0) { setOnboardErr('Enter your passphrase.'); return; }
    setOnboardErr(''); setOnboardStep('busy');
    try {
      await window.HT.authenticate(onboardPass);
      localStorage.setItem('ht-mode', 'cloud');
      setCloudMode('cloud');
      window.HT.startBridge();
      // Immediately pull remote so any data on this account shows up.
      try { await window.HT.tick(); } catch {}
      setShowOnboarding(false);
      setOnboardPass('');
    } catch (e) {
      setOnboardStep('cloudExisting');
      setOnboardErr(e?.message === 'wrong_passphrase'
        ? 'Wrong passphrase. Try again, or use a different device.'
        : e?.message === 'passkey_assertion_cancelled'
          ? 'Face ID / Touch ID was cancelled. Try again.'
          : `Sign-in failed: ${e?.message ?? 'unknown error'}`);
    }
  };

  return (
    <div className="min-h-screen bg-gradient-to-br from-gray-50 to-blue-50">
      {/* API Key Prompt Modal */}
      {showApiKeyPrompt && !apiKey && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[100] p-4">
          <div className="bg-white rounded-2xl p-6 max-w-md w-full">
            <h2 className="text-xl font-bold mb-2">OpenAI API Key Required</h2>
            <p className="text-sm text-gray-600 mb-4">
              This app uses OpenAI to analyze food and exercise. Your key is stored only in your browser's localStorage - never in the source code.
            </p>
            <input
              type="password"
              placeholder="sk-..."
              className="w-full px-4 py-3 border rounded-xl mb-3"
              id="api-key-input"
              onKeyDown={(e) => {
                if (e.key === 'Enter') {
                  const key = e.target.value.trim();
                  if (key.length > 10) {
                    localStorage.setItem('openai-api-key', key);
                    setApiKey(key);
                    setShowApiKeyPrompt(false);
                  }
                }
              }}
            />
            <button
              onClick={() => {
                const key = document.getElementById('api-key-input').value.trim();
                if (key.length > 10) {
                  localStorage.setItem('openai-api-key', key);
                  setApiKey(key);
                  setShowApiKeyPrompt(false);
                } else {
                  alert('Please enter a valid OpenAI API key');
                }
              }}
              className="w-full px-6 py-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-xl font-semibold"
            >
              Save Key
            </button>
            <button
              onClick={() => setShowApiKeyPrompt(false)}
              className="w-full px-6 py-2 mt-2 text-gray-500 text-sm"
            >
              Skip for now (limited features)
            </button>
            <p className="text-xs text-gray-500 mt-3 text-center">
              Get your key at <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener" className="text-blue-600 underline">platform.openai.com/api-keys</a>
            </p>
          </div>
        </div>
      )}

      {/* Onboarding modal — first run, or when the user opens it from Settings */}
      {showOnboarding && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[100] p-4">
          <div className="bg-white rounded-2xl p-6 max-w-md w-full">
            {!htReady && (
              <p className="text-sm text-gray-500">Loading encryption modules…</p>
            )}
            {htReady && onboardStep === 'choose' && (
              <>
                <h2 className="text-xl font-bold mb-1">How do you want to use Health Tracker?</h2>
                <p className="text-sm text-gray-600 mb-5">
                  You can switch later from Settings.
                </p>
                <button
                  onClick={beginCloudNew}
                  className="w-full text-left px-4 py-3 mb-2 rounded-xl border-2 border-blue-500 bg-blue-50 hover:bg-blue-100"
                >
                  <div className="font-semibold text-blue-900">Sync across my devices</div>
                  <div className="text-xs text-blue-800 mt-1">Face ID + a passphrase. End-to-end encrypted. Sign in on iPhone, Mac, anywhere.</div>
                </button>
                <button
                  onClick={beginCloudExisting}
                  className="w-full text-left px-4 py-3 mb-2 rounded-xl border border-gray-300 hover:bg-gray-50"
                >
                  <div className="font-semibold">I already have an account</div>
                  <div className="text-xs text-gray-600 mt-1">Sign in on a new device with your passphrase.</div>
                </button>
                <button
                  onClick={chooseLocalOnly}
                  className="w-full text-left px-4 py-3 rounded-xl border border-gray-300 hover:bg-gray-50"
                >
                  <div className="font-semibold">Just this device</div>
                  <div className="text-xs text-gray-600 mt-1">No sign-in. Data stays in this browser only. Standard backup/restore via export still works.</div>
                </button>
              </>
            )}
            {htReady && onboardStep === 'cloudNew' && (
              <>
                <h2 className="text-xl font-bold mb-1">Create an account</h2>
                <p className="text-sm text-gray-600 mb-4">
                  Pick a passphrase to encrypt your data. You'll need it again on each new device. <strong>If you lose it, your data is gone — there is no recovery.</strong>
                </p>
                <input
                  type="password"
                  autoFocus
                  value={onboardPass}
                  onChange={(e) => setOnboardPass(e.target.value)}
                  placeholder="Passphrase (8+ characters)"
                  className="w-full px-4 py-3 border rounded-xl mb-3"
                  onKeyDown={(e) => e.key === 'Enter' && submitCloudNew()}
                />
                {onboardErr && <p className="text-sm text-red-600 mb-3">{onboardErr}</p>}
                <button
                  onClick={submitCloudNew}
                  className="w-full px-6 py-3 bg-gradient-to-r from-blue-600 to-green-600 text-white rounded-xl font-semibold"
                >
                  Create passkey & encrypt
                </button>
                <button
                  onClick={() => setOnboardStep('choose')}
                  className="w-full px-6 py-2 mt-2 text-gray-500 text-sm"
                >
                  Back
                </button>
              </>
            )}
            {htReady && onboardStep === 'cloudExisting' && (
              <>
                <h2 className="text-xl font-bold mb-1">Sign in</h2>
                <p className="text-sm text-gray-600 mb-4">
                  Face ID / Touch ID will pick the right passkey automatically. Then enter your passphrase to decrypt your data.
                </p>
                <input
                  type="password"
                  autoFocus
                  value={onboardPass}
                  onChange={(e) => setOnboardPass(e.target.value)}
                  placeholder="Passphrase"
                  className="w-full px-4 py-3 border rounded-xl mb-3"
                  onKeyDown={(e) => e.key === 'Enter' && submitCloudExisting()}
                />
                {onboardErr && <p className="text-sm text-red-600 mb-3">{onboardErr}</p>}
                <button
                  onClick={submitCloudExisting}
                  className="w-full px-6 py-3 bg-gradient-to-r from-blue-600 to-green-600 text-white rounded-xl font-semibold"
                >
                  Sign in
                </button>
                <button
                  onClick={() => setOnboardStep('choose')}
                  className="w-full px-6 py-2 mt-2 text-gray-500 text-sm"
                >
                  Back
                </button>
              </>
            )}
            {htReady && onboardStep === 'unlock' && (
              <>
                <h2 className="text-xl font-bold mb-1">Welcome back</h2>
                <p className="text-sm text-gray-600 mb-4">
                  Enter your passphrase to decrypt your data on this device.
                </p>
                <input
                  type="password"
                  autoFocus
                  value={onboardPass}
                  onChange={(e) => setOnboardPass(e.target.value)}
                  placeholder="Passphrase"
                  className="w-full px-4 py-3 border rounded-xl mb-3"
                  onKeyDown={(e) => e.key === 'Enter' && submitCloudExisting()}
                />
                {onboardErr && <p className="text-sm text-red-600 mb-3">{onboardErr}</p>}
                <button
                  onClick={submitCloudExisting}
                  className="w-full px-6 py-3 bg-gradient-to-r from-blue-600 to-green-600 text-white rounded-xl font-semibold"
                >
                  Unlock
                </button>
              </>
            )}
            {onboardStep === 'busy' && (
              <p className="text-sm text-gray-600">Working… (Face ID prompt may appear)</p>
            )}
          </div>
        </div>
      )}

      {/* Settings modal — sync account management, three wipe operations, backend URL */}
      {showSettings && htReady && (
        <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-[100] p-4">
          <div className="bg-white rounded-2xl p-6 max-w-md w-full">
            <h2 className="text-xl font-bold mb-4">Cloud sync settings</h2>
            <p className="text-xs text-gray-500 mb-1">SIGNED IN</p>
            <p className="text-sm mb-4">{window.HT.getUserId() ? window.HT.getUserId().slice(0, 16) + '…' : '(not signed in this session)'}</p>

            <div className="border-t pt-4 mb-4">
              <p className="text-xs text-gray-500 mb-2">BACKEND URL</p>
              <input
                type="text"
                defaultValue={window.HT.getBackendUrl()}
                onChange={(e) => setBackendUrlInput(e.target.value)}
                className="w-full px-3 py-2 border rounded-lg text-sm font-mono"
              />
              <button
                onClick={() => {
                  try { window.HT.setBackendUrl(backendUrlInput || ''); alert('Backend URL updated.'); }
                  catch (e) { alert('Invalid URL: ' + e.message); }
                }}
                className="text-xs text-blue-600 mt-1"
              >
                Save backend URL
              </button>
              <p className="text-xs text-gray-500 mt-2">
                Defaults to the canonical instance. Self-hosters paste their own worker URL here.
              </p>
            </div>

            <div className="border-t pt-4 mb-4 space-y-2">
              <button
                onClick={async () => {
                  if (!confirm('Sign out of this device? Your cloud data and other devices are untouched.')) return;
                  await window.HT.signOutThisDevice();
                  setShowSettings(false);
                  setShowOnboarding(true);
                  setOnboardStep('choose');
                }}
                className="w-full px-4 py-2.5 bg-gray-100 text-gray-700 rounded-xl font-semibold text-sm"
              >
                Sign out (this device)
              </button>
              <button
                onClick={async () => {
                  if (!confirm('Delete ALL cloud data? Other devices will see empty data on next sync. Local data on this device is kept.')) return;
                  try {
                    await window.HT.deleteCloudData({ alsoLocal: false });
                    alert('Cloud data deleted.');
                  } catch (e) { alert('Failed: ' + e.message); }
                }}
                className="w-full px-4 py-2.5 bg-orange-100 text-orange-700 rounded-xl font-semibold text-sm"
              >
                Delete cloud data
              </button>
              <button
                onClick={async () => {
                  const phrase = prompt('Type WIPE to wipe everything (cloud + local) on this account. This cannot be undone.');
                  if (phrase !== 'WIPE') return;
                  try {
                    await window.HT.wipeEverything();
                    alert("Wiped. Your passkey is still in your system Keychain — go to Settings → Passwords on your phone or Mac to delete it.");
                    window.location.reload();
                  } catch (e) { alert('Failed: ' + e.message); }
                }}
                className="w-full px-4 py-2.5 bg-red-100 text-red-700 rounded-xl font-semibold text-sm"
              >
                Wipe everything
              </button>
            </div>

            <button
              onClick={() => setShowSettings(false)}
              className="w-full px-6 py-2 mt-2 text-gray-500 text-sm"
            >
              Close
            </button>
          </div>
        </div>
      )}

      <div className="max-w-5xl mx-auto p-4 sm:p-6 pb-32">
        <div className="flex items-center justify-between mb-4">
          <h1 className="text-2xl font-bold bg-gradient-to-r from-blue-600 to-purple-600 bg-clip-text text-transparent tracking-tight">
            Health Tracker
          </h1>
        </div>

        {false && showBackupReminder && (
          <div></div>
        )}

        <div className="bg-white rounded-2xl shadow-lg mb-6 overflow-hidden">
          <div className="flex">
            <button
              onClick={() => { setActiveTab('log'); setShowCalendar(false); }}
              className={`flex-1 px-4 py-4 font-semibold ${activeTab === 'log' ? 'text-blue-600 bg-blue-50' : 'text-gray-600'}`}
            >
              Log
            </button>
            <button
              onClick={() => { setActiveTab('summary'); setShowCalendar(false); }}
              className={`flex-1 px-4 py-4 font-semibold ${activeTab === 'summary' ? 'text-blue-600 bg-blue-50' : 'text-gray-600'}`}
            >
              Summary
            </button>
            <button
              onClick={() => { setActiveTab('profile'); setShowCalendar(false); }}
              className={`flex-1 px-4 py-4 font-semibold ${activeTab === 'profile' ? 'text-blue-600 bg-blue-50' : 'text-gray-600'}`}
            >
              Profile
            </button>
          </div>
        </div>

        {activeTab === 'log' && (
          <div className="space-y-4">
            <div className="bg-white rounded-2xl shadow-lg p-6 flex flex-col" style={{minHeight: 'calc(100dvh - 10rem)'}}>
              {/* Date Navigation */}
              <div className="mb-6 relative">
                <div className="flex items-center justify-between">
                  <button
                    onClick={() => navigateDay(-1)}
                    className="px-4 py-2 bg-gray-100 rounded-xl hover:bg-gray-200 text-xl font-bold"
                  >
                    &larr;
                  </button>
                  <div
                    className="flex-1 mx-3 text-center font-bold text-xl cursor-pointer hover:text-blue-600 transition-colors"
                    onClick={openCalendar}
                  >
                    {formatDate(currentDate, true)}
                  </div>
                  <button
                    onClick={() => navigateDay(1)}
                    disabled={!canNavigateForward()}
                    className="px-4 py-2 bg-gray-100 rounded-xl hover:bg-gray-200 disabled:opacity-30 text-xl font-bold"
                  >
                    &rarr;
                  </button>
                </div>

                {showCalendar && (
                  <div className="absolute z-50 left-0 right-0 mt-2 bg-white border-2 border-gray-200 rounded-2xl shadow-xl p-4">
                    <div className="flex justify-between items-center mb-3">
                      <button onClick={() => navigateCalendarMonth(-1)} className="px-2 py-1 hover:bg-gray-100 rounded text-xl font-bold">&larr;</button>
                      <div className="font-bold text-lg">
                        {new Date(calendarYear, calendarMonth).toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}
                      </div>
                      <button onClick={() => navigateCalendarMonth(1)} className="px-2 py-1 hover:bg-gray-100 rounded text-xl font-bold">&rarr;</button>
                      <button onClick={() => setShowCalendar(false)} className="w-8 h-8 flex items-center justify-center rounded-full text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors ml-2"><X className="w-4 h-4" /></button>
                    </div>
                    <div className="grid grid-cols-7 gap-1">
                      {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(day => (
                        <div key={day} className="text-center text-xs font-semibold text-gray-600 py-1">{day}</div>
                      ))}
                      {getCalendarDays().map((dateStr, index) => {
                        if (!dateStr) return <div key={`blank-${index}`} className="aspect-square" />;
                        const isSelected = dateStr === currentDate;
                        const isToday = dateStr === toLocalDateStr(new Date());
                        const isFuture = dateStr > toLocalDateStr(new Date());
                        const dayNum = parseInt(dateStr.split('-')[2]);
                        return (
                          <button
                            key={dateStr}
                            onClick={() => !isFuture && selectDate(dateStr)}
                            disabled={isFuture}
                            className={`aspect-square flex items-center justify-center text-sm rounded-lg font-medium transition-all
                              ${isSelected ? 'bg-blue-600 text-white' : ''}
                              ${!isSelected && isToday ? 'bg-blue-100 text-blue-700' : ''}
                              ${!isSelected && !isToday && !isFuture ? 'hover:bg-gray-100' : ''}
                              ${isFuture ? 'text-gray-300 cursor-not-allowed' : 'cursor-pointer'}
                            `}
                          >
                            {dayNum}
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}
              </div>

              {/* Today's Summary */}
              {(foods.length > 0 || exercises.length > 0) && (
                <div className="mb-6">
                  <div className="grid grid-cols-3 gap-3 mb-2">
                    <div className="bg-blue-50 rounded-xl p-3 text-center">
                      <div className="text-xs text-gray-500 mb-1">Calories</div>
                      <div className="text-xl font-bold text-blue-600">{totals.calories.toFixed(0)}</div>
                      <div className="text-xs text-gray-400">/ {calorieGoalMin.toFixed(0)}</div>
                    </div>
                    <div className="bg-green-50 rounded-xl p-3 text-center">
                      <div className="text-xs text-gray-500 mb-1">Protein</div>
                      <div className="text-xl font-bold text-green-600">{totals.protein.toFixed(0)}g</div>
                      <div className="text-xs text-gray-400">/ {proteinGoal}g</div>
                    </div>
                    <div className="bg-purple-50 rounded-xl p-3 text-center">
                      <div className="text-xs text-gray-500 mb-1">Logged</div>
                      <div className="text-xl font-bold text-purple-600">{foods.length + exercises.length}</div>
                      <div className="text-xs text-gray-400">{foods.length}F · {exercises.length}E</div>
                    </div>
                  </div>
                  <button
                    onClick={() => { setActiveTab('summary'); setSummaryView('day'); }}
                    className="block ml-auto text-xs text-blue-600 hover:text-blue-800 font-semibold transition-colors"
                  >
                    View Summary &rarr;
                  </button>
                </div>
              )}

              {/* Universal Log */}
              <div className="mb-6 flex-1 flex flex-col min-h-0">
                <textarea
                  value={logDescription}
                  onChange={(e) => setLogDescription(e.target.value)}
                  onKeyDown={(e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addLog(); } }}
                  placeholder={logImages.length > 0 ? "Optional: add details like portion size, exercise duration..." : logPlaceholder}
                  className="w-full px-4 py-3 border rounded-xl resize-none mb-3 overflow-y-auto flex-1"
                  style={{minHeight: '2.5em'}}
                />

                {/* Photo Upload */}
                <div className="mb-3">
                  <input
                    type="file"
                    accept="image/*"
                    multiple
                    onChange={handleLogImageUpload}
                    id="log-image-input"
                    className="hidden"
                  />
                  <label
                    htmlFor="log-image-input"
                    className={`flex items-center justify-center gap-2 w-full px-4 py-3 border-2 border-dashed rounded-xl cursor-pointer transition-colors ${
                      logImages.length >= 10 ? 'border-gray-200 text-gray-300 cursor-not-allowed' : 'border-blue-300 text-blue-600 hover:bg-blue-50 hover:border-blue-400'
                    }`}
                    onClick={(e) => { if (logImages.length >= 10) e.preventDefault(); }}
                  >
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span className="font-semibold text-sm">
                      {logImages.length === 0 ? 'Upload Photos' : `Add More (${logImages.length}/10)`}
                    </span>
                  </label>

                  {/* Image Previews */}
                  {logImages.length > 0 && (
                    <div className="flex flex-wrap gap-2 mt-2">
                      {logImages.map((img, index) => (
                        <div key={index} className="relative w-20 h-20 rounded-lg overflow-hidden border-2 border-gray-200">
                          <img src={img.preview} alt={`Photo ${index + 1}`} className="w-full h-full object-cover" />
                          <button
                            onClick={() => removeLogImage(index)}
                            className="absolute top-0.5 right-0.5 w-5 h-5 bg-red-500 text-white rounded-full flex items-center justify-center text-xs font-bold leading-none"
                          >X</button>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
                <button
                  onClick={addLog}
                  disabled={isAnalyzingLog || (!logDescription && logImages.length === 0)}
                  className="w-full px-6 py-3 bg-gradient-to-r from-blue-600 to-purple-600 text-white rounded-xl font-semibold disabled:opacity-50"
                >
                  {isAnalyzingLog ? 'Analyzing...' : <><Plus className="inline w-5 h-5 mr-2" />Log Entry</>}
                </button>
              </div>

              {/* Finish Logging / Day Review */}
              {(foods.length > 0 || exercises.length > 0) && (
                <div className="mt-6">
                  <div className="border-t border-gray-200 my-4"></div>
                  <button
                    onClick={reviewDay}
                    disabled={isReviewingDay || !apiKey}
                    className="w-full px-6 py-3.5 bg-gradient-to-r from-amber-500 to-orange-500 text-white rounded-xl font-semibold shadow-lg disabled:opacity-50 transition-all"
                  >
                    {isReviewingDay ? 'Evaluating your day...' : 'Review My Day'}
                  </button>
                  {!apiKey && (
                    <p className="text-xs text-gray-400 text-center mt-1">Set up OpenAI API key in Information tab to use this feature</p>
                  )}
                  {dayReview && (
                    <div className="mt-4 p-4 bg-gradient-to-br from-amber-50 to-orange-50 border-2 border-amber-200 rounded-2xl">
                      <h4 className="font-bold text-lg mb-3">Day Review</h4>
                      <p className="text-sm text-gray-700 mb-3">{dayReview.summary}</p>
                      <div className="bg-white/70 rounded-xl p-3 mb-3">
                        <div className="text-xs font-bold text-gray-500 mb-1">1-MONTH PREDICTION</div>
                        <div className="text-lg font-bold text-indigo-700">{dayReview.prediction}</div>
                        <div className="text-xs text-gray-500">if every day was like today</div>
                      </div>
                      <div className="bg-white/70 rounded-xl p-3">
                        <div className="text-xs font-bold text-gray-500 mb-1">TIP FOR TOMORROW</div>
                        <p className="text-sm text-gray-700">{dayReview.tip}</p>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        )}

        {activeTab === 'summary' && (
          <div className="space-y-4">
            <div className="bg-white rounded-2xl shadow-lg p-4">
              <div className="flex gap-2 mb-6">
                <button
                  onClick={() => { setSummaryView('day'); setWeekOffset(0); setMonthOffset(0); }}
                  className={`flex-1 px-4 py-2 rounded-xl font-semibold ${summaryView === 'day' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600'}`}
                >Day</button>
                <button
                  onClick={() => { setSummaryView('week'); setWeekOffset(0); setMonthOffset(0); setShowCalendar(false); }}
                  className={`flex-1 px-4 py-2 rounded-xl font-semibold ${summaryView === 'week' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600'}`}
                >Week</button>
                <button
                  onClick={() => { setSummaryView('month'); setWeekOffset(0); setMonthOffset(0); setShowCalendar(false); }}
                  className={`flex-1 px-4 py-2 rounded-xl font-semibold ${summaryView === 'month' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-600'}`}
                >Month</button>
              </div>

              {summaryView === 'day' && (
                <div>
                  <div className="flex items-center justify-between mb-4 relative">
                    <button onClick={() => navigateDay(-1)} className="px-4 py-2 bg-gray-100 rounded-xl hover:bg-gray-200 text-xl font-bold">&larr;</button>
                    <div className="flex-1 mx-3 text-center font-bold text-xl cursor-pointer hover:text-blue-600 transition-colors" onClick={openCalendar}>
                      {formatDate(currentDate, true)}
                    </div>
                    <button onClick={() => navigateDay(1)} disabled={!canNavigateForward()} className="px-4 py-2 bg-gray-100 rounded-xl hover:bg-gray-200 disabled:opacity-30 text-xl font-bold">&rarr;</button>

                    {showCalendar && (
                      <div className="absolute z-50 left-0 right-0 top-full mt-2 bg-white border-2 border-gray-200 rounded-2xl shadow-xl p-4">
                        <div className="flex justify-between items-center mb-3">
                          <button onClick={() => navigateCalendarMonth(-1)} className="px-2 py-1 hover:bg-gray-100 rounded text-xl font-bold">&larr;</button>
                          <div className="font-bold text-lg">
                            {new Date(calendarYear, calendarMonth).toLocaleDateString('en-US', { month: 'long', year: 'numeric' })}
                          </div>
                          <button onClick={() => navigateCalendarMonth(1)} className="px-2 py-1 hover:bg-gray-100 rounded text-xl font-bold">&rarr;</button>
                          <button onClick={() => setShowCalendar(false)} className="w-8 h-8 flex items-center justify-center rounded-full text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors ml-2"><X className="w-4 h-4" /></button>
                        </div>
                        <div className="grid grid-cols-7 gap-1">
                          {['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'].map(day => (
                            <div key={day} className="text-center text-xs font-semibold text-gray-600 py-1">{day}</div>
                          ))}
                          {getCalendarDays().map((dateStr, index) => {
                            if (!dateStr) return <div key={`blank-${index}`} className="aspect-square" />;
                            const isSelected = dateStr === currentDate;
                            const isToday = dateStr === toLocalDateStr(new Date());
                            const isFuture = dateStr > toLocalDateStr(new Date());
                            const dayNum = parseInt(dateStr.split('-')[2]);
                            return (
                              <button key={dateStr} onClick={() => !isFuture && selectDate(dateStr)} disabled={isFuture}
                                className={`aspect-square flex items-center justify-center text-sm rounded-lg font-medium transition-all
                                  ${isSelected ? 'bg-blue-600 text-white' : ''}
                                  ${!isSelected && isToday ? 'bg-blue-100 text-blue-700' : ''}
                                  ${!isSelected && !isToday && !isFuture ? 'hover:bg-gray-100' : ''}
                                  ${isFuture ? 'text-gray-300 cursor-not-allowed' : 'cursor-pointer'}`}
                              >{dayNum}</button>
                            );
                          })}
                        </div>
                      </div>
                    )}
                  </div>

                  {foods.length === 0 && exercises.length === 0 && !weight && !isPeriod ? (
                    <div className="text-center py-12 text-gray-400">
                      <div className="font-medium">No data here yet</div>
                      <div className="text-sm mt-1">Add food or exercise in the Log tab</div>
                    </div>
                  ) : (
                    <>
                      <div className="grid grid-cols-2 gap-3 mb-4">
                        <div className="bg-blue-50 rounded-xl p-3">
                          <div className="text-xs font-bold text-gray-600">CALORIES</div>
                          <div className="text-2xl font-bold text-blue-600">{totals.calories.toFixed(0)}</div>
                          <div className="text-xs text-gray-500">Goal: {calorieGoalMin}</div>
                        </div>
                        <div className="bg-green-50 rounded-xl p-3">
                          <div className="text-xs font-bold text-gray-600">PROTEIN</div>
                          <div className="text-2xl font-bold text-green-600">{totals.protein.toFixed(0)}g</div>
                          <div className="text-xs text-gray-500">Goal: {proteinGoal}g</div>
                        </div>
                      </div>

                      {exerciseCalories > 0 && (
                        <div className="bg-purple-50 rounded-xl p-3 mb-4">
                          <div className="text-xs font-bold text-gray-600 mb-1">EXERCISE IMPACT</div>
                          <div className="text-sm">
                            <span className="font-semibold text-purple-700">+{exerciseCalories} cal</span>
                            <span className="text-gray-600"> added to base goal ({baseGoalMin})</span>
                          </div>
                        </div>
                      )}

                      {(weight || (userProfile.periodTracking && isPeriod)) && (
                        <div className="mb-4">
                          <h4 className="font-bold text-sm text-gray-600 mb-2">TRACKING</h4>
                          <div className="space-y-2">
                            {weight && (
                              <div>
                                {editingWeight ? (
                                  <div className="p-3 bg-blue-50 border-2 border-blue-200 rounded-xl">
                                    <input
                                      type="number"
                                      step="0.1"
                                      value={editingWeightValue}
                                      onChange={(e) => setEditingWeightValue(e.target.value)}
                                      onKeyDown={(e) => {
                                        if (e.key === 'Enter') {
                                          const val = editingWeightValue;
                                          if (val === '') { setWeight(''); setEditingWeight(false); updateDayStorage(currentDate, { weight: '' }); return; }
                                          const lbsVal = isMetric ? (parseFloat(val) / 0.453592).toFixed(1) : parseFloat(val).toFixed(1);
                                          setWeight(lbsVal);
                                          setEditingWeight(false);
                                          updateDayStorage(currentDate, { weight: lbsVal });
                                        }
                                        if (e.key === 'Escape') setEditingWeight(false);
                                      }}
                                      className="w-full px-3 py-2 border rounded-lg mb-2"
                                      placeholder={`Enter weight in ${weightLabel}`}
                                      autoFocus
                                    />
                                    <div className="flex gap-2">
                                      <button
                                        onClick={() => {
                                          const val = editingWeightValue;
                                          if (val === '') { setWeight(''); setEditingWeight(false); updateDayStorage(currentDate, { weight: '' }); return; }
                                          const lbsVal = isMetric ? (parseFloat(val) / 0.453592).toFixed(1) : parseFloat(val).toFixed(1);
                                          setWeight(lbsVal);
                                          setEditingWeight(false);
                                          updateDayStorage(currentDate, { weight: lbsVal });
                                        }}
                                        className="flex-1 px-3 py-1.5 bg-blue-600 text-white rounded-lg text-sm font-semibold"
                                      >
                                        Save
                                      </button>
                                      <button
                                        onClick={() => setEditingWeight(false)}
                                        className="flex-1 px-3 py-1.5 bg-gray-200 text-gray-700 rounded-lg text-sm font-semibold"
                                      >
                                        Cancel
                                      </button>
                                    </div>
                                  </div>
                                ) : (
                                  <div
                                    className="flex justify-between items-center p-3 bg-white border-2 border-gray-200 rounded-xl hover:border-blue-300 hover:shadow-md cursor-pointer transition-all duration-200"
                                    onClick={() => { setEditingWeightValue(displayWeight(weight)); setEditingWeight(true); }}
                                  >
                                    <div className="flex-1">
                                      <div className="font-medium">Weight</div>
                                      <div className="text-xs text-gray-600">{displayWeight(weight)} {weightLabel}</div>
                                    </div>
                                    <button
                                      onClick={(e) => { e.stopPropagation(); setWeight(''); updateDayStorage(currentDate, { weight: '' }); }}
                                      className="text-blue-500 ml-2 p-2 hover:bg-blue-50 rounded-lg transition-colors"
                                    >
                                      <Trash2 className="w-4 h-4" />
                                    </button>
                                  </div>
                                )}
                              </div>
                            )}
                            {userProfile.periodTracking && isPeriod && (
                              <div className="flex justify-between items-center p-3 bg-white border-2 border-gray-200 rounded-xl transition-all duration-200">
                                <div className="flex-1">
                                  <div className="font-medium">Period</div>
                                  <div className="text-xs text-gray-600">Logged</div>
                                </div>
                                <button
                                  onClick={() => { setIsPeriod(false); updateDayStorage(currentDate, { isPeriod: false }); }}
                                  className="text-blue-500 ml-2 p-2 hover:bg-blue-50 rounded-lg transition-colors"
                                >
                                  <Trash2 className="w-4 h-4" />
                                </button>
                              </div>
                            )}
                          </div>
                        </div>
                      )}

                      {foods.length > 0 && (
                        <div className="mb-4">
                          <h4 className="font-bold text-sm text-gray-600 mb-2">FOODS</h4>
                          <div className="space-y-2">
                            {foods.map((food) => (
                              <div key={food.id}>
                                {editingFoodId === food.id ? (
                                  <div className="p-3 bg-blue-50 border-2 border-blue-200 rounded-xl">
                                    <input
                                      type="text"
                                      value={editingFoodText}
                                      onChange={(e) => setEditingFoodText(e.target.value)}
                                      onKeyDown={(e) => {
                                        if (e.key === 'Enter') saveEditedFood();
                                        if (e.key === 'Escape') cancelEditFood();
                                      }}
                                      className="w-full px-3 py-2 border rounded-lg mb-2"
                                      placeholder="e.g., 3 scrambled eggs"
                                      autoFocus
                                    />
                                    <div className="flex gap-2">
                                      <button
                                        onClick={saveEditedFood}
                                        disabled={isAnalyzingLog}
                                        className="flex-1 px-3 py-1.5 bg-blue-600 text-white rounded-lg text-sm font-semibold disabled:opacity-50"
                                      >
                                        {isAnalyzingLog ? 'Analyzing...' : 'Save'}
                                      </button>
                                      <button
                                        onClick={cancelEditFood}
                                        className="flex-1 px-3 py-1.5 bg-gray-200 text-gray-700 rounded-lg text-sm font-semibold"
                                      >
                                        Cancel
                                      </button>
                                    </div>
                                  </div>
                                ) : (
                                  <div
                                    className="flex justify-between items-center p-3 bg-white border-2 border-gray-200 rounded-xl hover:border-blue-300 hover:shadow-md cursor-pointer transition-all duration-200"
                                    onClick={() => startEditingFood(food)}
                                  >
                                    <div className="flex-1">
                                      <div className="font-medium">{food.name}</div>
                                      <div className="text-xs text-gray-600">
                                        {food.calories} cal · Protein: {food.protein}g · Fat: {food.fat}g · Carbs: {food.carbs}g
                                      </div>
                                    </div>
                                    <button
                                      onClick={(e) => { e.stopPropagation(); deleteFood(food.id); }}
                                      className="text-blue-500 ml-2 p-2 hover:bg-blue-50 rounded-lg transition-colors"
                                    >
                                      <Trash2 className="w-4 h-4" />
                                    </button>
                                  </div>
                                )}
                              </div>
                            ))}
                          </div>
                        </div>
                      )}

                      {exercises.length > 0 && (
                        <div>
                          <h4 className="font-bold text-sm text-gray-600 mb-2">EXERCISES</h4>
                          <div className="space-y-2">
                            {exercises.map((ex) => (
                              <div key={ex.id}>
                                {editingExerciseId === ex.id ? (
                                  <div className="p-3 bg-green-50 border-2 border-green-200 rounded-xl">
                                    <input
                                      type="text"
                                      value={editingExerciseText}
                                      onChange={(e) => setEditingExerciseText(e.target.value)}
                                      onKeyDown={(e) => {
                                        if (e.key === 'Enter') saveEditedExercise();
                                        if (e.key === 'Escape') cancelEditExercise();
                                      }}
                                      className="w-full px-3 py-2 border rounded-lg mb-2"
                                      placeholder="e.g., Judo training"
                                      autoFocus
                                    />
                                    <div className="flex gap-2">
                                      <button
                                        onClick={saveEditedExercise}
                                        disabled={isAnalyzingLog}
                                        className="flex-1 px-3 py-1.5 bg-green-600 text-white rounded-lg text-sm font-semibold disabled:opacity-50"
                                      >
                                        {isAnalyzingLog ? 'Estimating...' : 'Save'}
                                      </button>
                                      <button
                                        onClick={cancelEditExercise}
                                        className="flex-1 px-3 py-1.5 bg-gray-200 text-gray-700 rounded-lg text-sm font-semibold"
                                      >
                                        Cancel
                                      </button>
                                    </div>
                                  </div>
                                ) : (
                                  <div
                                    className="flex justify-between items-center p-3 bg-white border-2 border-gray-200 rounded-xl hover:border-green-300 hover:shadow-md cursor-pointer transition-all duration-200"
                                    onClick={() => startEditingExercise(ex)}
                                  >
                                    <div className="flex-1">
                                      <div className="font-medium">{ex.type}</div>
                                      <span className="text-xs text-gray-600">-{ex.calories} cal</span>
                                    </div>
                                    <button
                                      onClick={(e) => { e.stopPropagation(); deleteExercise(ex.id); }}
                                      className="text-blue-500 ml-2 p-2 hover:bg-blue-50 rounded-lg transition-colors"
                                    >
                                      <Trash2 className="w-4 h-4" />
                                    </button>
                                  </div>
                                )}
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                    </>
                  )}
                </div>
              )}

              {summaryView === 'week' && (
                <div>
                  {(() => {
                    const weekData = getWeekData();
                    const daysWithData = weekData.filter(day => (day.foods || []).length > 0);
                    const totalCals = daysWithData.reduce((sum, day) => sum + (day.foods || []).reduce((s, f) => s + f.calories, 0), 0);
                    const totalProtein = daysWithData.reduce((sum, day) => sum + (day.foods || []).reduce((s, f) => s + f.protein, 0), 0);
                    const avgCals = daysWithData.length > 0 ? totalCals / daysWithData.length : 0;
                    const avgProtein = daysWithData.length > 0 ? totalProtein / daysWithData.length : 0;
                    const firstDay = weekData[0]?.date || '';
                    const lastDay = weekData[6]?.date || '';
                    return (
                      <>
                        <div className="flex items-center justify-between mb-4">
                          <button onClick={() => setWeekOffset(weekOffset - 1)} className="px-4 py-2 bg-gray-100 rounded-xl hover:bg-gray-200 text-xl font-bold">&larr;</button>

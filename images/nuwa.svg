<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="nuwaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1b2838;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a1b3d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="serpentBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4ecdc4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d8b83;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="cosmicGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" style="stop-color:#e8d5b7;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#e8d5b7;stop-opacity:0" />
    </radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#nuwaBg)"/>
  <!-- Stars -->
  <g opacity="0.6">
    <circle cx="50" cy="50" r="1.5" fill="white"/>
    <circle cx="150" cy="80" r="1" fill="white"/>
    <circle cx="500" cy="60" r="1.5" fill="white"/>
    <circle cx="400" cy="150" r="1" fill="white"/>
    <circle cx="550" cy="200" r="1.5" fill="white"/>
    <circle cx="80" cy="300" r="1" fill="white"/>
    <circle cx="520" cy="400" r="1" fill="white"/>
    <circle cx="100" cy="500" r="1.5" fill="white"/>
    <circle cx="480" cy="550" r="1" fill="white"/>
  </g>
  <!-- Cosmic glow behind figure -->
  <circle cx="300" cy="250" r="200" fill="url(#cosmicGlow)"/>
  <!-- Nuwa figure - upper body -->
  <g transform="translate(300, 250)">
    <!-- Hair flowing -->
    <path d="M-60,-120 Q-80,-80 -100,-20 Q-110,30 -90,60" fill="#1a1a2e" stroke="#2a2a4e" stroke-width="1"/>
    <path d="M-50,-130 Q-70,-90 -85,-30 Q-95,20 -80,50" fill="#1a1a2e" stroke="#2a2a4e" stroke-width="1"/>
    <path d="M60,-120 Q80,-80 100,-20 Q110,30 90,60" fill="#1a1a2e" stroke="#2a2a4e" stroke-width="1"/>
    <path d="M50,-130 Q70,-90 85,-30 Q95,20 80,50" fill="#1a1a2e" stroke="#2a2a4e" stroke-width="1"/>
    <!-- Head -->
    <ellipse cx="0" cy="-100" rx="45" ry="55" fill="#e8d5b7"/>
    <!-- Hair on head -->
    <path d="M-45,-110 Q-50,-160 -20,-170 Q0,-175 20,-170 Q50,-160 45,-110" fill="#1a1a2e"/>
    <!-- Crown/headdress -->
    <path d="M-30,-165 Q-20,-190 0,-195 Q20,-190 30,-165" fill="none" stroke="#c9a96e" stroke-width="2"/>
    <circle cx="0" cy="-195" r="8" fill="#c9a96e"/>
    <circle cx="-20" cy="-180" r="5" fill="#4ecdc4"/>
    <circle cx="20" cy="-180" r="5" fill="#4ecdc4"/>
    <!-- Face -->
    <path d="M-15,-105 Q-10,-112 -5,-105" fill="none" stroke="#5a4a3a" stroke-width="1.5"/>
    <path d="M5,-105 Q10,-112 15,-105" fill="none" stroke="#5a4a3a" stroke-width="1.5"/>
    <path d="M-5,-85 Q0,-80 5,-85" fill="none" stroke="#c97b6b" stroke-width="1.5"/>
    <!-- Robes -->
    <path d="M-40,-45 Q-60,0 -70,60 Q-60,80 -40,90" fill="#4ecdc4" opacity="0.8"/>
    <path d="M40,-45 Q60,0 70,60 Q60,80 40,90" fill="#4ecdc4" opacity="0.8"/>
    <path d="M-35,-45 L-30,80 Q0,100 30,80 L35,-45 Z" fill="#e8d5b7" opacity="0.3"/>
    <!-- Flowing sash -->
    <path d="M-60,20 Q-100,10 -130,30 Q-140,50 -120,60" fill="none" stroke="#ff6b6b" stroke-width="4" opacity="0.7"/>
    <path d="M60,20 Q100,10 130,30 Q140,50 120,60" fill="none" stroke="#ff6b6b" stroke-width="4" opacity="0.7"/>
    <!-- Serpent lower body -->
    <path d="M-30,90 Q-40,150 -20,220 Q0,280 30,320 Q60,350 40,400 Q20,440 -20,460 Q-60,470 -80,440 Q-90,410 -60,390 Q-30,380 0,400 Q30,420 50,460" fill="none" stroke="url(#serpentBody)" stroke-width="30" stroke-linecap="round" opacity="0.8"/>
    <!-- Scales pattern on tail -->
    <g opacity="0.3">
      <path d="M-25,120 Q-15,115 -5,120" fill="none" stroke="#2d8b83" stroke-width="1"/>
      <path d="M-20,150 Q-10,145 0,150" fill="none" stroke="#2d8b83" stroke-width="1"/>
      <path d="M-10,180 Q0,175 10,180" fill="none" stroke="#2d8b83" stroke-width="1"/>
      <path d="M0,220 Q10,215 20,220" fill="none" stroke="#2d8b83" stroke-width="1"/>
      <path d="M15,260 Q25,255 35,260" fill="none" stroke="#2d8b83" stroke-width="1"/>
    </g>
    <!-- Glowing orb in hands -->
    <circle cx="0" cy="10" r="25" fill="#4ecdc4" opacity="0.3"/>
    <circle cx="0" cy="10" r="15" fill="#4ecdc4" opacity="0.5"/>
    <circle cx="0" cy="10" r="8" fill="white" opacity="0.7"/>
    <!-- Hands -->
    <path d="M-25,0 Q-20,15 -15,10" fill="#e8d5b7" stroke="#d4c0a0" stroke-width="1"/>
    <path d="M25,0 Q20,15 15,10" fill="#e8d5b7" stroke="#d4c0a0" stroke-width="1"/>
  </g>
</svg>
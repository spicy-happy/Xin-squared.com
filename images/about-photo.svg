<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="photoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8d5c0;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#photoBg)"/>
  <!-- Simple artist portrait placeholder -->
  <g transform="translate(200, 180)">
    <!-- Head -->
    <circle cx="0" cy="0" r="55" fill="#d4a574"/>
    <!-- Hair -->
    <path d="M-55,0 Q-60,-60 -25,-75 Q0,-82 25,-75 Q60,-60 55,0" fill="#1a1a1a"/>
    <path d="M-50,-10 Q-55,-55 -20,-68 Q0,-72 20,-68 Q55,-55 50,-10" fill="#1a1a1a"/>
    <!-- Eyes -->
    <path d="M-20,-5 Q-14,-12 -8,-5" fill="none" stroke="#333" stroke-width="2"/>
    <path d="M8,-5 Q14,-12 20,-5" fill="none" stroke="#333" stroke-width="2"/>
    <!-- Smile -->
    <path d="M-12,15 Q0,25 12,15" fill="none" stroke="#333" stroke-width="2"/>
    <!-- Shoulders -->
    <path d="M-55,55 Q-70,70 -80,100 L80,100 Q70,70 55,55" fill="#4a4a6a"/>
  </g>
  <!-- Art tools scattered -->
  <g opacity="0.3">
    <!-- Pencil -->
    <rect x="320" y="300" width="60" height="6" rx="2" fill="#c9a96e" transform="rotate(-30, 350, 303)"/>
    <polygon points="315,298 310,303 320,303" fill="#333" transform="rotate(-30, 350, 303)"/>
    <!-- Brush -->
    <rect x="30" y="320" width="50" height="5" rx="2" fill="#8B6914" transform="rotate(20, 55, 322)"/>
    <ellipse cx="28" cy="321" rx="8" ry="4" fill="#333" transform="rotate(20, 55, 322)"/>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="obiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d1b4e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="saberGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#80bfff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a9eff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="600" height="800" fill="url(#obiBg)"/>
  <!-- Stars background -->
  <g opacity="0.4">
    <circle cx="80" cy="60" r="1" fill="white"/>
    <circle cx="200" cy="100" r="1.5" fill="white"/>
    <circle cx="450" cy="80" r="1" fill="white"/>
    <circle cx="520" cy="150" r="1.5" fill="white"/>
    <circle cx="100" cy="250" r="1" fill="white"/>
    <circle cx="550" cy="350" r="1" fill="white"/>
    <circle cx="70" cy="450" r="1.5" fill="white"/>
    <circle cx="530" cy="500" r="1" fill="white"/>
  </g>
  <!-- Figure -->
  <g transform="translate(300, 350)">
    <!-- Cloak -->
    <path d="M-80,-150 Q-100,-50 -110,50 Q-115,150 -100,250 L100,250 Q115,150 110,50 Q100,-50 80,-150 Z" fill="#5c4033" opacity="0.9"/>
    <!-- Inner robe -->
    <path d="M-50,-140 Q-60,-50 -60,50 L-40,200 L40,200 L60,50 Q60,-50 50,-140 Z" fill="#8B7355"/>
    <!-- Belt/sash -->
    <rect x="-55" y="30" width="110" height="15" rx="3" fill="#6b5b4a"/>
    <!-- Head -->
    <circle cx="0" cy="-180" r="42" fill="#e0c8a8"/>
    <!-- Hair -->
    <path d="M-40,-185 Q-45,-230 -15,-235 Q0,-238 15,-235 Q45,-230 40,-185" fill="#c9a96e"/>
    <!-- Beard -->
    <path d="M-20,-145 Q0,-130 20,-145" fill="#c9a96e" opacity="0.8"/>
    <path d="M-15,-140 Q0,-125 15,-140" fill="#c9a96e" opacity="0.6"/>
    <!-- Eyes -->
    <ellipse cx="-12" cy="-185" rx="5" ry="4" fill="#5a7a9a"/>
    <ellipse cx="12" cy="-185" rx="5" ry="4" fill="#5a7a9a"/>
    <circle cx="-12" cy="-185" r="2.5" fill="#2a4a6a"/>
    <circle cx="12" cy="-185" r="2.5" fill="#2a4a6a"/>
    <!-- Nose -->
    <path d="M-2,-175 Q0,-165 2,-175" fill="none" stroke="#c0a888" stroke-width="1"/>
    <!-- Mouth -->
    <path d="M-8,-158 Q0,-155 8,-158" fill="none" stroke="#b09080" stroke-width="1.5"/>
    <!-- Hood shadow -->
    <path d="M-50,-210 Q-55,-250 0,-260 Q55,-250 50,-210" fill="#4a3525" opacity="0.7"/>
    <!-- Arms -->
    <path d="M-80,-100 Q-120,-60 -140,0 Q-145,20 -130,30" fill="#5c4033" stroke="#4a3525" stroke-width="1"/>
    <path d="M80,-100 Q100,-80 110,-40 Q115,-10 100,10" fill="#5c4033" stroke="#4a3525" stroke-width="1"/>
    <!-- Lightsaber -->
    <g filter="url(#glow)">
      <rect x="103" y="-40" width="5" height="-280" rx="2" fill="url(#saberGlow)" opacity="0.9"/>
    </g>
    <rect x="103" y="-40" width="5" height="-280" rx="2" fill="white" opacity="0.3"/>
    <!-- Saber hilt -->
    <rect x="99" y="-35" width="13" height="40" rx="2" fill="#888"/>
    <rect x="101" y="-30" width="9" height="5" fill="#666"/>
    <rect x="101" y="-20" width="9" height="5" fill="#666"/>
    <circle cx="105" cy="-10" r="3" fill="#c00" opacity="0.8"/>
  </g>
</svg>
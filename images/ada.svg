<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <linearGradient id="adaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#2d1b4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0a1628;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="dressGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6a3d9a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a1d7a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="800" fill="url(#adaBg)"/>
  <!-- Circuit/code pattern background -->
  <g opacity="0.08" stroke="#9b59b6" stroke-width="1" fill="none">
    <path d="M50,100 L150,100 L150,200 L250,200"/>
    <path d="M350,50 L350,150 L450,150 L450,250"/>
    <path d="M100,400 L200,400 L200,500"/>
    <path d="M400,350 L500,350 L500,450 L550,450"/>
    <circle cx="150" cy="100" r="4" fill="#9b59b6"/>
    <circle cx="250" cy="200" r="4" fill="#9b59b6"/>
    <circle cx="450" cy="150" r="4" fill="#9b59b6"/>
    <circle cx="200" cy="400" r="4" fill="#9b59b6"/>
    <circle cx="500" cy="350" r="4" fill="#9b59b6"/>
  </g>
  <!-- Binary/numbers floating -->
  <g opacity="0.1" font-family="'Courier New', monospace" font-size="14" fill="#9b59b6">
    <text x="50" y="150">10110</text>
    <text x="450" y="200">01101</text>
    <text x="100" y="450">11010</text>
    <text x="400" y="500">00111</text>
    <text x="500" y="650">10011</text>
  </g>
  <!-- Ada Lovelace figure -->
  <g transform="translate(300, 350)">
    <!-- Dress -->
    <path d="M-60,-30 Q-100,100 -130,250 L130,250 Q100,100 60,-30 Z" fill="url(#dressGrad)"/>
    <!-- Dress details -->
    <path d="M-60,-30 Q0,0 60,-30" fill="none" stroke="#8a5dc0" stroke-width="1"/>
    <path d="M-80,50 Q0,80 80,50" fill="none" stroke="#8a5dc0" stroke-width="1" opacity="0.5"/>
    <path d="M-100,130 Q0,160 100,130" fill="none" stroke="#8a5dc0" stroke-width="1" opacity="0.3"/>
    <!-- Shoulders/bodice -->
    <path d="M-60,-30 Q-70,-60 -50,-80 Q0,-100 50,-80 Q70,-60 60,-30 Z" fill="url(#dressGrad)"/>
    <!-- Neck -->
    <rect x="-12" y="-110" width="24" height="35" rx="10" fill="#e8d5b7"/>
    <!-- Head -->
    <ellipse cx="0" cy="-145" rx="40" ry="48" fill="#e8d5b7"/>
    <!-- Hair - Victorian style updo -->
    <path d="M-40,-155 Q-45,-200 -20,-210 Q0,-215 20,-210 Q45,-200 40,-155" fill="#3a2a1a"/>
    <path d="M-35,-145 Q-50,-160 -45,-185 Q-40,-200 -20,-205" fill="#3a2a1a"/>
    <path d="M35,-145 Q50,-160 45,-185 Q40,-200 20,-205" fill="#3a2a1a"/>
    <!-- Hair curls at sides -->
    <circle cx="-42" cy="-140" r="10" fill="#3a2a1a"/>
    <circle cx="42" cy="-140" r="10" fill="#3a2a1a"/>
    <circle cx="-38" cy="-130" r="8" fill="#3a2a1a"/>
    <circle cx="38" cy="-130" r="8" fill="#3a2a1a"/>
    <!-- Eyes -->
    <ellipse cx="-12" cy="-150" rx="6" ry="5" fill="white"/>
    <ellipse cx="12" cy="-150" rx="6" ry="5" fill="white"/>
    <circle cx="-11" cy="-149" r="3" fill="#4a3520"/>
    <circle cx="13" cy="-149" r="3" fill="#4a3520"/>
    <!-- Eyebrows -->
    <path d="M-20,-160 Q-12,-165 -5,-160" fill="none" stroke="#3a2a1a" stroke-width="1.5"/>
    <path d="M5,-160 Q12,-165 20,-160" fill="none" stroke="#3a2a1a" stroke-width="1.5"/>
    <!-- Nose -->
    <path d="M-2,-140 Q0,-134 2,-140" fill="none" stroke="#d4b89a" stroke-width="1"/>
    <!-- Mouth -->
    <path d="M-8,-125 Q0,-121 8,-125" fill="none" stroke="#c08070" stroke-width="1.5"/>
    <!-- Arms -->
    <path d="M-60,-50 Q-90,-20 -100,20 Q-105,40 -90,50" fill="url(#dressGrad)" stroke="#5a2d8a" stroke-width="1"/>
    <path d="M60,-50 Q90,-20 100,20 Q105,40 90,50" fill="url(#dressGrad)" stroke="#5a2d8a" stroke-width="1"/>
    <!-- Hands -->
    <circle cx="-90" cy="55" r="10" fill="#e8d5b7"/>
    <circle cx="90" cy="55" r="10" fill="#e8d5b7"/>
    <!-- Book/notes in hand -->
    <rect x="-110" y="40" width="30" height="40" rx="2" fill="#f5f0e0" transform="rotate(-10, -95, 60)"/>
    <line x1="-105" y1="50" x2="-85" y2="48" stroke="#999" stroke-width="0.5"/>
    <line x1="-105" y1="55" x2="-85" y2="53" stroke="#999" stroke-width="0.5"/>
    <line x1="-105" y1="60" x2="-85" y2="58" stroke="#999" stroke-width="0.5"/>
    <!-- Necklace -->
    <path d="M-20,-95 Q0,-85 20,-95" fill="none" stroke="#c9a96e" stroke-width="1.5"/>
    <circle cx="0" cy="-84" r="4" fill="#c9a96e"/>
  </g>
  <!-- Gear/computation motif -->
  <g transform="translate(480, 650)" opacity="0.2">
    <circle cx="0" cy="0" r="30" fill="none" stroke="#9b59b6" stroke-width="2"/>
    <circle cx="0" cy="0" r="20" fill="none" stroke="#9b59b6" stroke-width="1.5"/>
    <rect x="-4" y="-35" width="8" height="10" rx="2" fill="#9b59b6"/>
    <rect x="-4" y="25" width="8" height="10" rx="2" fill="#9b59b6"/>
    <rect x="-35" y="-4" width="10" height="8" rx="2" fill="#9b59b6"/>
    <rect x="25" y="-4" width="10" height="8" rx="2" fill="#9b59b6"/>
  </g>
  <g transform="translate(120, 680)" opacity="0.15">
    <circle cx="0" cy="0" r="22" fill="none" stroke="#9b59b6" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke="#9b59b6" stroke-width="1"/>
    <rect x="-3" y="-26" width="6" height="8" rx="2" fill="#9b59b6"/>
    <rect x="-3" y="18" width="6" height="8" rx="2" fill="#9b59b6"/>
    <rect x="-26" y="-3" width="8" height="6" rx="2" fill="#9b59b6"/>
    <rect x="18" y="-3" width="8" height="6" rx="2" fill="#9b59b6"/>
  </g>
</svg>
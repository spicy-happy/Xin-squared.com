<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="chillBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fecfef;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a8edea;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="zillaSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5cb85c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d8b3d;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#chillBg)"/>
  <!-- City skyline background -->
  <g opacity="0.15">
    <rect x="50" y="350" width="40" height="250" fill="#333"/>
    <rect x="100" y="300" width="50" height="300" fill="#333"/>
    <rect x="160" y="380" width="35" height="220" fill="#333"/>
    <rect x="380" y="320" width="45" height="280" fill="#333"/>
    <rect x="440" y="360" width="55" height="240" fill="#333"/>
    <rect x="510" y="340" width="40" height="260" fill="#333"/>
  </g>
  <!-- Chillzilla body -->
  <g transform="translate(300, 320)">
    <!-- Tail -->
    <path d="M60,80 Q120,60 160,100 Q180,130 200,110" fill="url(#zillaSkin)" stroke="#2d7a2d" stroke-width="2"/>
    <!-- Body -->
    <ellipse cx="0" cy="60" rx="90" ry="70" fill="url(#zillaSkin)"/>
    <!-- Belly -->
    <ellipse cx="0" cy="70" rx="55" ry="50" fill="#8fdf8f" opacity="0.6"/>
    <!-- Head -->
    <ellipse cx="0" cy="-30" rx="65" ry="55" fill="url(#zillaSkin)"/>
    <!-- Spines -->
    <polygon points="-15,-85 -5,-110 5,-85" fill="#2d7a2d"/>
    <polygon points="-5,-80 5,-105 15,-80" fill="#3d8b3d"/>
    <polygon points="5,-75 15,-95 25,-70" fill="#2d7a2d"/>
    <polygon points="-25,-75 -15,-95 -5,-70" fill="#3d8b3d"/>
    <!-- Eyes - sleepy/chill -->
    <ellipse cx="-20" cy="-35" rx="16" ry="18" fill="white"/>
    <ellipse cx="20" cy="-35" rx="16" ry="18" fill="white"/>
    <circle cx="-18" cy="-33" r="8" fill="#333"/>
    <circle cx="22" cy="-33" r="8" fill="#333"/>
    <circle cx="-16" cy="-35" r="3" fill="white"/>
    <circle cx="24" cy="-35" r="3" fill="white"/>
    <!-- Half-closed eyelids (chill expression) -->
    <path d="M-36,-40 Q-20,-50 -4,-40" fill="url(#zillaSkin)" opacity="0.7"/>
    <path d="M4,-40 Q20,-50 36,-40" fill="url(#zillaSkin)" opacity="0.7"/>
    <!-- Smile -->
    <path d="M-25,-5 Q0,15 25,-5" fill="none" stroke="#2d5a2d" stroke-width="3" stroke-linecap="round"/>
    <!-- Arms -->
    <path d="M-80,30 Q-110,10 -120,30 Q-125,45 -110,50" fill="url(#zillaSkin)" stroke="#2d7a2d" stroke-width="2"/>
    <path d="M80,30 Q110,10 120,30 Q125,45 110,50" fill="url(#zillaSkin)" stroke="#2d7a2d" stroke-width="2"/>
    <!-- Sunglasses -->
    <rect x="-42" y="-48" width="35" height="25" rx="5" fill="#333" opacity="0.85"/>
    <rect x="7" y="-48" width="35" height="25" rx="5" fill="#333" opacity="0.85"/>
    <line x1="-7" y1="-38" x2="7" y2="-38" stroke="#333" stroke-width="3"/>
    <!-- Legs -->
    <ellipse cx="-35" cy="130" rx="25" ry="15" fill="url(#zillaSkin)"/>
    <ellipse cx="35" cy="130" rx="25" ry="15" fill="url(#zillaSkin)"/>
    <!-- Toes -->
    <circle cx="-50" cy="135" r="6" fill="#3d8b3d"/>
    <circle cx="-35" cy="140" r="6" fill="#3d8b3d"/>
    <circle cx="-20" cy="135" r="6" fill="#3d8b3d"/>
    <circle cx="20" cy="135" r="6" fill="#3d8b3d"/>
    <circle cx="35" cy="140" r="6" fill="#3d8b3d"/>
    <circle cx="50" cy="135" r="6" fill="#3d8b3d"/>
    <!-- Drink in hand -->
    <g transform="translate(-115, 35)">
      <rect x="-10" y="-20" width="20" height="35" rx="3" fill="#ff6b6b"/>
      <rect x="-8" y="-18" width="16" height="10" fill="#ff8a8a"/>
      <line x1="0" y1="-20" x2="0" y2="-35" stroke="#c9a96e" stroke-width="2"/>
      <circle cx="0" cy="-38" r="5" fill="#ff6b6b"/>
      <circle cx="3" cy="-40" r="3" fill="#ffeb3b"/>
    </g>
  </g>
</svg>
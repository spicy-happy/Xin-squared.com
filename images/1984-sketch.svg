<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800">
  <defs>
    <filter id="pencil">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="5" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.5"/>
    </filter>
  </defs>
  <rect width="600" height="800" fill="#f5f0e8"/>
  <!-- Paper texture lines -->
  <g opacity="0.06">
    <line x1="0" y1="40" x2="600" y2="40" stroke="#8B7355" stroke-width="0.5"/>
    <line x1="0" y1="80" x2="600" y2="80" stroke="#8B7355" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="600" y2="120" stroke="#8B7355" stroke-width="0.5"/>
    <line x1="0" y1="160" x2="600" y2="160" stroke="#8B7355" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="600" y2="200" stroke="#8B7355" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="600" y2="240" stroke="#8B7355" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="600" y2="280" stroke="#8B7355" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="600" y2="320" stroke="#8B7355" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="600" y2="360" stroke="#8B7355" stroke-width="0.5"/>
    <line x1="0" y1="400" x2="600" y2="400" stroke="#8B7355" stroke-width="0.5"/>
  </g>
  <!-- Pencil sketch of face/figure -->
  <g filter="url(#pencil)" opacity="0.85">
    <!-- Head outline -->
    <ellipse cx="300" cy="250" rx="95" ry="120" fill="none" stroke="#3a3a3a" stroke-width="2"/>
    <!-- Eyes -->
    <ellipse cx="265" cy="240" rx="22" ry="12" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
    <circle cx="265" cy="240" r="6" fill="#3a3a3a"/>
    <ellipse cx="335" cy="240" rx="22" ry="12" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
    <circle cx="335" cy="240" r="6" fill="#3a3a3a"/>
    <!-- Nose -->
    <path d="M295 260 Q300 290 305 260" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
    <!-- Mouth -->
    <path d="M270 305 Q300 320 330 305" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
    <!-- Hair strokes -->
    <path d="M205 200 Q220 120 300 100 Q380 120 395 200" fill="none" stroke="#3a3a3a" stroke-width="2"/>
    <path d="M210 210 Q230 140 300 120 Q370 140 390 210" fill="none" stroke="#3a3a3a" stroke-width="1"/>
    <path d="M215 195 Q235 130 300 110 Q365 130 385 195" fill="none" stroke="#3a3a3a" stroke-width="1.5"/>
    <!-- Shoulders -->
    <path d="M210 370 Q220 400 300 410 Q380 400 390 370" fill="none" stroke="#3a3a3a" stroke-width="2"/>
    <line x1="210" y1="370" x2="150" y2="500" stroke="#3a3a3a" stroke-width="2"/>
    <line x1="390" y1="370" x2="450" y2="500" stroke="#3a3a3a" stroke-width="2"/>
  </g>
  <!-- Cross-hatching details -->
  <g opacity="0.3">
    <line x1="240" y1="260" x2="250" y2="270" stroke="#3a3a3a" stroke-width="0.8"/>
    <line x1="243" y1="260" x2="253" y2="270" stroke="#3a3a3a" stroke-width="0.8"/>
    <line x1="350" y1="260" x2="360" y2="270" stroke="#3a3a3a" stroke-width="0.8"/>
    <line x1="353" y1="260" x2="363" y2="270" stroke="#3a3a3a" stroke-width="0.8"/>
  </g>
  <!-- Label -->
  <text x="300" y="650" font-family="'Courier New', monospace" font-size="18" fill="#666" text-anchor="middle" font-style="italic">1984 - Character Study</text>
  <text x="300" y="680" font-family="'Courier New', monospace" font-size="14" fill="#999" text-anchor="middle">Pencil on paper</text>
</svg>
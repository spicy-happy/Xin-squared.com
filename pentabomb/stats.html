<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>PENTABOMB STATS</title>
<style>
  :root {
    --gb-lightest: #9bbc0f;
    --gb-light: #8bac0f;
    --gb-dark: #306230;
    --gb-darkest: #0f380f;
    --shell: #2b2b2b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    background: var(--shell);
    font-family: "Courier New", Courier, monospace;
    font-weight: bold;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 16px;
  }
  #screen {
    background: var(--gb-lightest);
    border: 6px solid var(--gb-darkest);
    border-radius: 8px;
    box-shadow: 0 0 0 4px #444, 0 8px 30px rgba(0,0,0,.6);
    color: var(--gb-darkest);
    padding: 16px;
    width: 100%;
    max-width: 640px;
  }
  h1 { font-size: 20px; letter-spacing: 3px; text-align: center; }
  .sub { font-size: 10px; letter-spacing: 1px; text-align: center; margin: 6px 0 14px; }
  #tiles {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
    gap: 8px;
    margin-bottom: 16px;
  }
  .tile {
    border: 2px solid var(--gb-darkest);
    border-radius: 4px;
    padding: 8px;
    background: var(--gb-light);
  }
  .tile .label { font-size: 9px; letter-spacing: 1px; }
  .tile .value { font-size: 20px; letter-spacing: 1px; line-height: 1.3; }
  .tile .note { font-size: 9px; letter-spacing: 1px; opacity: .8; }
  h2 { font-size: 12px; letter-spacing: 2px; margin: 14px 0 6px; }
  .tableWrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 11px; letter-spacing: 1px; }
  th, td { padding: 4px 8px; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  thead th { border-bottom: 2px solid var(--gb-darkest); font-size: 9px; }
  tbody tr:nth-child(odd) { background: var(--gb-light); }
  #msg { font-size: 11px; letter-spacing: 1px; text-align: center; padding: 12px 0; }
  a { color: var(--gb-darkest); }
  .foot { font-size: 9px; letter-spacing: 1px; text-align: center; margin-top: 14px; line-height: 1.7; }
</style>
</head>
<body>
<div id="screen">
  <h1>PENTABOMB STATS</h1>
  <div class="sub">AGGREGATE COUNTERS &#183; NO COOKIES, NO IDS</div>
  <div id="msg">LOADING...</div>
  <div id="tiles" hidden></div>
  <h2 id="dailyTitle" hidden>LAST 14 DAYS</h2>
  <div class="tableWrap" hidden id="tableWrap">
    <table>
      <thead>
        <tr>
          <th>DATE</th><th>VISITS</th><th>NEW</th><th>STARTED</th>
          <th>FINISHED</th><th>AVG SCORE</th><th>BEST</th><th>AVG TIME</th>
        </tr>
      </thead>
      <tbody id="dayRows"></tbody>
    </table>
  </div>
  <div class="foot">
    VISITS = PAGE LOADS &#183; NEW = FIRST-TIME DEVICES<br>
    <a href="/pentabomb/">&#9664; BACK TO THE GAME</a>
  </div>
</div>

<script>
'use strict';
const SCORES_API = 'https://pentamino-scores.mail-f78.workers.dev';
const $ = id => document.getElementById(id);
const fmt = n => Number(n || 0).toLocaleString('en-US');
const mmss = sec => {
  sec = Math.round(sec || 0);
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
};

function tile(label, value, note) {
  const div = document.createElement('div');
  div.className = 'tile';
  div.innerHTML = '<div class="label">' + label + '</div>' +
    '<div class="value">' + value + '</div>' +
    (note ? '<div class="note">' + note + '</div>' : '');
  return div;
}

async function load() {
  let data;
  try {
    const res = await fetch(SCORES_API + '/stats');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (e) {
    $('msg').textContent = 'STATS OFFLINE (' + e.message + ')';
    return;
  }
  const all = data.all || {};
  $('msg').hidden = true;
  const tiles = $('tiles');
  tiles.hidden = false;
  tiles.append(
    tile('VISITS (ALL TIME)', fmt(all.visits)),
    tile('NEW VISITORS', fmt(all.uniques)),
    tile('GAMES STARTED', fmt(all.starts)),
    tile('GAMES FINISHED', fmt(all.ends)),
    tile('AVG SCORE', fmt(all.avgScore), 'PER FINISHED GAME'),
    tile('AVG GAME TIME', mmss(all.avgSec), 'MIN:SEC'),
    tile('BEST SCORE', fmt(all.best)),
    tile('FINISH RATE', all.starts ? Math.round(100 * all.ends / all.starts) + '%' : '&#8212;',
         'FINISHED / STARTED'),
    tile('SHARES', fmt(all.shares || 0), 'SHARE BUTTON TAPS'),
    tile('CHALLENGE VISITS', fmt(all.challenges || 0), 'ARRIVED VIA SHARE LINK'),
  );
  const days = Array.isArray(data.days) ? data.days : [];
  if (days.length) {
    $('dailyTitle').hidden = false;
    $('tableWrap').hidden = false;
    const tbody = $('dayRows');
    for (const d of days) {
      const tr = document.createElement('tr');
      const cells = [
        d.date, fmt(d.visits), fmt(d.uniques), fmt(d.starts),
        fmt(d.ends), fmt(d.avgScore), fmt(d.best), mmss(d.avgSec),
      ];
      tr.innerHTML = cells.map(c => '<td>' + c + '</td>').join('');
      tbody.appendChild(tr);
    }
  }
}
load();
</script>
</body>
</html>

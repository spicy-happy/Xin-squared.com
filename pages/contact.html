<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get in touch with Xin Xin for illustration, design, and creative collaboration.">
  <title>Contact | Xin Xin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="header" id="header">
    <div class="container">
      <a href="../index.html" class="logo">Xin<span>&sup2;</span></a>
      <nav>
        <ul class="nav-links" id="navLinks">
          <li><a href="../index.html">Work</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </header>

  <!-- Contact Section -->
  <section class="contact-section">
    <div class="container">
      <div class="contact-wrapper">
        <h1>Get in Touch</h1>
        <p class="subtitle">Interested in working together? Have a question about my work? I'd love to hear from you.</p>

        <form class="contact-form" action="#" method="post">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Your name" required>
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="your@email.com" required>
          </div>
          <div class="form-group">
            <label for="subject">Subject</label>
            <input type="text" id="subject" name="subject" placeholder="What's this about?">
          </div>
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Tell me about your project..." required></textarea>
          </div>
          <button type="submit" class="submit-btn">Send Message</button>
        </form>

        <div class="contact-info">
          <div class="contact-info-item">
            <h4>Email</h4>
            <p>hello@xin-squared.com</p>
          </div>
          <div class="contact-info-item">
            <h4>Social</h4>
            <p>@xinxin on Instagram</p>
          </div>
          <div class="contact-info-item">
            <h4>Location</h4>
            <p>Available worldwide</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <a href="../index.html" class="logo">Xin<span>&sup2;</span></a>
      <div class="footer-links">
        <a href="../index.html">Work</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </div>
      <p class="copyright">&copy; 2024 Xin Xin. All rights reserved.</p>
    </div>
  </footer>

  <script>
    const header = document.getElementById('header');
    window.addEventListener('scroll', () => {
      header.classList.toggle('scrolled', window.scrollY > 50);
    });
    const menuToggle = document.getElementById('menuToggle');
    const navLinks = document.getElementById('navLinks');
    menuToggle.addEventListener('click', () => {
      navLinks.classList.toggle('open');
    });
    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => navLinks.classList.remove('open'));
    });
  </script>

</body>
</html>
